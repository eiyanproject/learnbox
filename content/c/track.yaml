title: "C"
order: 6
description: "C from the compiler up: pointers, memory, structs and the standard library, with every lesson compiled by gcc and checked by real tests."
sections:
  - id: environment
    title: Environment
    description: "The toolchain, the build, and what happens between source and a running program."
  - id: learn
    title: Beginner
    description: "Types and integer behaviour, pointers, strings, structs, dynamic memory, and files."
  - id: intermediate
    title: Intermediate
    description: "Function pointers and dispatch tables, the preprocessor, linked lists and the pointer-to-pointer idiom, and bit manipulation."
  - id: advanced
    title: Advanced
    description: "A generic container over void*, a hash table, arena allocation, and a tokenizer capstone."
