title: Python
order: 1
description: From your first print() to metaclasses, asyncio and a capstone project. Everything runs on real CPython in your own terminal.
badge: "Pythonista"
sections:
  - id: learn
    xp: 50
    beginner: true
    title: Beginner
    description: Syntax, types, control flow, collections, files and classes.
  - id: intermediate
    xp: 75
    title: Intermediate
    description: Idiomatic Python. Closures, decorators, generators, dataclasses, context managers and the standard library.
  - id: advanced
    xp: 100
    title: Advanced
    description: The data model, descriptors, typing, concurrency, asyncio and performance.
  - id: pro
    xp: 150
    title: Pro
    description: Metaprogramming, testing strategy, process pools, async servers, and building real tools.
  - id: exam-basic
    xp: 100
    title: Exam - Certification
    description: Practice for the Python 3 Engineer Certification Basic Exam, weighted the way the real paper is. Six papers covering all forty questions' worth of syllabus.
  - id: exam-review
    xp: 100
    title: Exam - Review
    description: Cumulative exams over the Beginner section. Topics arrive mixed and unlabelled, the way they do when you actually need them.
  - id: arena
    title: Arena
    arena: true
    description: Timed challenges against the clock. Three rounds, then the boss.
  - id: practice
    title: Practice
    description: Exercises from the Exercism Python track (MIT). Same editor, same tests, less hand-holding.
