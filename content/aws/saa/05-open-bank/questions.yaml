    - "AWS Transfer Family"
  correct: [B]
  why: "Trusted Advisor provides best-practice checks across categories including cost optimization, security, fault tolerance, performance, and service limits. Backup Audit Manager focuses on backup compliance, QuickSight is BI, and Transfer Family handles file transfers. Key rule: Use Trusted Advisor for broad account-level best-practice checks."
  ref: "Q318 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor-check-reference.html"
  exams: [saa-open]

- id: open-saa-q319
  kind: choice
  en: "A company wants nonpersistent cloud desktops for a training lab where users receive a fresh curated desktop environment and do not keep a personalized machine. Which WorkSpaces option best fits?"
  options:
    - "WorkSpaces Pools"
    - "AWS Batch job queue"
    - "Amazon AppStream image builder only"
    - "WorkSpaces Personal"
  correct: [A]
  why: "WorkSpaces Pools are intended for nonpersistent virtual desktops hosted on ephemeral infrastructure, while WorkSpaces Personal provides persistent desktops assigned to individual users. Batch and AppStream image builders do not directly match this WorkSpaces desktop pool requirement. Key rule: Use WorkSpaces Pools for nonpersistent curated cloud desktops."
  ref: "Q319 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html"
  exams: [saa-open]

- id: open-saa-q320
  kind: choice
  en: "A team completed a production design and wants a structured AWS review across security, reliability, operational excellence, performance efficiency, cost optimization, and sustainability before launch. Which framework should guide the review?"
  options:
    - "Amazon VPC IPAM"
    - "AWS Well-Architected Framework"
    - "AWS Schema Conversion Tool"
    - "AWS Cost Anomaly Detection"
  correct: [B]
  why: "The AWS Well-Architected Framework provides a structured way to evaluate architectures against AWS best-practice pillars. SCT converts schemas, Cost Anomaly Detection watches spend patterns, and IPAM manages IP addresses. Key rule: Use the Well-Architected Framework for broad architecture best-practice reviews."
  ref: "Q320 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/framework/operational-excellence.html ; https://docs.aws.amazon.com/wellarchitected/latest/framework/security.html ; https://docs.aws.amazon.com/wellarchitected/latest/framework/reliability.html"
  exams: [saa-open]

- id: open-saa-q321
  kind: choice
  en: "A company already records resource configuration with AWS Config and wants to evaluate whether resources comply with required configuration rules. Which capability should it use?"
  options:
    - "Amazon WorkSpaces Pools"
    - "AWS Cost Categories"
    - "CloudWatch Contributor Insights"
    - "AWS Config rules"
  correct: [D]
  why: "AWS Config rules evaluate resource configurations against desired settings and report compliance. Contributor Insights analyzes logs, WorkSpaces Pools provide desktops, and Cost Categories group charges. Key rule: Use AWS Config rules to evaluate resource configuration compliance."
  ref: "Q321 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config.html"
  exams: [saa-open]

- id: open-saa-q322
  kind: choice
  en: "A company wants to group spend into internal product lines for reporting, using rules based on accounts, services, tags, and dimensions. Which AWS billing feature should it use?"
  options:
    - "AWS RAM"
    - "AWS Backup Audit Manager"
    - "AWS Cost Anomaly Detection"
    - "AWS Cost Categories"
  correct: [D]
  why: "Cost Categories let organizations define rule-based groupings of AWS charges for internal reporting. Cost Anomaly Detection finds unusual spend, Backup Audit Manager audits backups, and RAM shares resources. Key rule: Use Cost Categories to map AWS charges into business-defined reporting groups."
  ref: "Q322 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-cost-categories.html"
  exams: [saa-open]

- id: open-saa-q323
  kind: choice
  en: "A platform team needs to share supported AWS resources with other accounts while keeping ownership in the provider account. Which service provides this cross-account sharing capability?"
  options:
    - "Amazon WorkSpaces"
    - "AWS Resource Access Manager"
    - "AWS IAM Identity Center"
    - "CloudWatch Contributor Insights"
  correct: [B]
  why: "AWS Resource Access Manager lets you share supported AWS resources with other accounts, OUs, or an organization while ownership remains with the resource owner. Identity Center manages workforce access, WorkSpaces provides desktops, and Contributor Insights analyzes logs. Key rule: Use AWS RAM for cross-account sharing of supported AWS resources."
  ref: "Q323 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/ram/latest/userguide/working-with-sharing-create.html"
  exams: [saa-open]

- id: open-saa-q324
  kind: choice
  en: "A company wants centralized workforce sign-in to AWS accounts, but workload applications running on EC2 still need AWS API permissions without human sign-in. Which combination is correct?"
  options:
    - "CloudFront signed URLs for AWS account access"
    - "IAM users with long-term keys for both workforce and workloads"
    - "IAM Identity Center for workforce access and IAM roles for workloads"
    - "Cost Categories for workforce access and SCPs for application credentials"
  correct: [C]
  why: "IAM Identity Center centralizes workforce access to AWS accounts and applications, while IAM roles provide temporary credentials for workloads such as EC2 applications. Long-term keys increase risk, and the other options do not provide these identity functions. Key rule: Use IAM Identity Center for people and IAM roles for workloads."
  ref: "Q324 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html"
  exams: [saa-open]

- id: open-saa-q325
  kind: choice
  en: "A team wants to find the top talkers in VPC Flow Logs and identify which source IPs are contributing most to traffic volume. Which CloudWatch capability is designed for this high-cardinality analysis?"
  options:
    - "AWS Trusted Advisor"
    - "AWS Control Tower"
    - "CloudWatch alarm on average CPU"
    - "CloudWatch Contributor Insights"
  correct: [D]
  why: "CloudWatch Contributor Insights analyzes high-cardinality log data and can identify top contributors such as source IPs in VPC Flow Logs. A basic CPU alarm, Trusted Advisor, and Control Tower do not perform top-contributor log analysis. Key rule: Use Contributor Insights to rank top contributors in high-cardinality logs."
  ref: "Q325 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContributorInsights.html"
  exams: [saa-open]
