- id: open-saa-q001
  kind: choice
  en: "A genomics team runs a preprocessing pipeline on EC2 instances in private subnets. The instances must write result files to an Amazon S3 bucket, and the security team does not want this traffic to depend on internet egress devices. The architects also want the lowest recurring network cost for this path. Which design best fits?"
  options:
    - "Create a gateway VPC endpoint for Amazon S3 and update the relevant route tables"
    - "Create an interface VPC endpoint for Amazon S3 in each subnet"
    - "Attach an internet gateway to the VPC and restrict the bucket with a bucket policy"
    - "Place a NAT gateway in each Availability Zone and route S3 traffic through it"
  correct: [A]
  why: "A gateway VPC endpoint is the native private path from a VPC to Amazon S3 and is the lowest recurring-cost option for this use case. NAT gateways would send the traffic through internet egress infrastructure and add processing charges, while an S3 interface endpoint is only needed for different connectivity boundaries, such as certain on-premises or cross-network patterns. The key decision is that the callers are inside the VPC and only need private access to S3. Key rule: Private Amazon S3 access from inside the VPC usually means a gateway endpoint, not NAT."
  ref: "Q001 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html ; https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html"
  exams: [saa-open]

- id: open-saa-q002
  kind: choice
  en: "A retailer has an ordering system in a branch data center connected to AWS through Direct Connect. The application must call Amazon DynamoDB privately, and the network team wants the traffic to stay on private connectivity all the way into AWS. Which option should the team choose?"
  options:
    - "Publish DynamoDB access through an Application Load Balancer"
    - "Create an interface VPC endpoint for DynamoDB"
    - "Send the traffic through a NAT gateway in a public subnet"
    - "Create a gateway VPC endpoint for DynamoDB"
  correct: [B]
  why: "Because the callers are reaching AWS from on-premises through a hybrid network, the team needs an interface endpoint for DynamoDB. A gateway endpoint is the low-cost choice for VPC-local access, but it is not the right construct for extending private service access from on-premises networks. NAT is still internet egress, and a load balancer is not how DynamoDB is exposed. The deciding boundary is that the request originates outside the VPC. Key rule: If the private path to DynamoDB must extend from on-premises into AWS, use an interface endpoint."
  ref: "Q002 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/privatelink-interface-endpoints.html ; https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-ddb.html"
  exams: [saa-open]

- id: open-saa-q003
  kind: choice
  en: "A software company runs build workers in private subnets across three Availability Zones. The workers must download package updates from internet repositories every night, and the design must continue working if a single Availability Zone fails. Which architecture is most appropriate?"
  options:
    - "One NAT gateway in each Availability Zone, with each private subnet routed to the NAT gateway in the same zone"
    - "One internet gateway per private subnet"
    - "One NAT gateway in a single public subnet for the whole VPC"
    - "One gateway VPC endpoint for all internet destinations"
  correct: [A]
  why: "NAT gateways provide outbound internet access for private subnets, but they are zonal resources. Using one NAT gateway per Availability Zone preserves egress when one zone fails and avoids cross-AZ dependency for every update flow. A single centralized NAT gateway would create an Availability Zone dependency, and gateway endpoints do not provide generic internet access. The requirement is resilient internet egress, not private access to a specific AWS service. Key rule: Private subnets needing resilient internet egress should use NAT gateways per Availability Zone."
  ref: "Q003 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html ; https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html"
  exams: [saa-open]

- id: open-saa-q004
  kind: choice
  en: "A SaaS company wants to let customers consume a billing API that runs on EC2 instances in the provider VPC. Customer VPC CIDR ranges often overlap with each other, and the provider wants customers to reach only that API, not the rest of the provider network. Which AWS design should be used?"
  options:
    - "Create VPC peering connections to every customer VPC"
    - "Expose the API through an endpoint service powered by AWS PrivateLink"
    - "Publish the API on the public internet behind an internet-facing Application Load Balancer"
    - "Attach all customer VPCs to one shared transit gateway"
  correct: [B]
  why: "AWS PrivateLink is designed for private, service-specific exposure from a provider VPC to consumer VPCs. It works well when consumer CIDR ranges overlap because it does not require full routed connectivity the way VPC peering or Transit Gateway attachments do. A public ALB would violate the private-only requirement. The deciding factor is that the provider wants to share one private service, not merge networks. Key rule: Private service publication to many consumers with overlapping CIDRs points to AWS PrivateLink."
  ref: "Q004 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/privatelink/create-endpoint-service.html"
  exams: [saa-open]

- id: open-saa-q005
  kind: choice
  en: "An enterprise has 30 application VPCs, separate inspection VPCs, and two on-premises data centers. The network team wants a single regional routing hub so they can avoid maintaining a growing mesh of peering links and can segment traffic with central route tables. Which AWS service best fits?"
  options:
    - "Use AWS Transit Gateway as the central routing hub"
    - "Use one interface endpoint in each VPC"
    - "Deploy AWS Client VPN for all network segments"
    - "Create full-mesh VPC peering among all VPCs and terminate the data centers with VPNs"
  correct: [A]
  why: "AWS Transit Gateway is the scalable hub-and-spoke construct for connecting many VPCs and on-premises networks through centralized routing. It reduces the operational burden of a peering mesh and supports route-table-based segmentation. Client VPN is for end users, not network hubs, and interface endpoints are service-specific rather than network-wide connectivity tools. The scope of connectivity here is many networks, not a single service or two-VPC link. Key rule: When many VPCs and on-premises networks need one routing hub, choose AWS Transit Gateway."
  ref: "Q005 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-centralized-router.html"
  exams: [saa-open]

- id: open-saa-q006
  kind: choice
  en: "A company keeps its shared CI tooling in one VPC and its internal developer portal in another VPC in the same Region. The VPC CIDR ranges do not overlap, only these two VPCs need to communicate, and the architects want the simplest private routing option. Which design is the best fit?"
  options:
    - "Expose the developer portal through AWS PrivateLink"
    - "Route traffic through a NAT gateway"
    - "Create a VPC peering connection between the two VPCs"
    - "Attach both VPCs to a new transit gateway"
  correct: [C]
  why: "VPC peering is the straightforward option when only two non-overlapping VPCs need private IP connectivity. Transit Gateway would add unnecessary operational surface for a simple two-VPC relationship, and NAT gateways do not provide private VPC-to-VPC routing. PrivateLink would only make sense if the goal were to expose one specific service rather than allow normal routed communication between both VPCs. Key rule: Two non-overlapping VPCs with simple private routing needs are a peering use case."
  ref: "Q006 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html"
  exams: [saa-open]

- id: open-saa-q007
  kind: choice
  en: "A trading firm wants a dedicated private link from its colocation facility to AWS for market data systems. The network team needs predictable bandwidth, BGP-based routing, and no dependence on internet VPN tunnels for the primary path. Which service should they adopt?"
  options:
    - "VPC peering"
    - "AWS Direct Connect"
    - "AWS Client VPN"
    - "AWS Site-to-Site VPN"
  correct: [B]
  why: "AWS Direct Connect provides dedicated private connectivity from an on-premises location to AWS and supports the hybrid routing model expected here. Site-to-Site VPN is useful but still traverses the internet, so it does not satisfy the dedicated primary-path requirement. Client VPN is for remote end users, and VPC peering does not connect on-premises sites. The deciding requirement is a dedicated private site-to-AWS connection. Key rule: Dedicated private hybrid connectivity from a site to AWS means AWS Direct Connect."
  ref: "Q007 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/directconnect/latest/UserGuide/WorkingWithConnections.html ; https://docs.aws.amazon.com/directconnect/latest/UserGuide/connection_options.html"
  exams: [saa-open]

- id: open-saa-q008
  kind: choice
  en: "A consulting company needs to give contractors secure access to internal dashboards hosted in private subnets. The contractors connect from home networks and travel frequently, and the company wants AWS to manage the remote-access service instead of operating its own VPN servers. Which AWS service is the best match?"
  options:
    - "AWS Site-to-Site VPN"
    - "AWS Transit Gateway"
    - "AWS Client VPN"
    - "Gateway VPC endpoint"
  correct: [C]
  why: "AWS Client VPN is the managed client-based remote-access service for users connecting from arbitrary locations into AWS resources and, if needed, on-premises networks. Site-to-Site VPN is for network-to-network connectivity, not a distributed workforce. Transit Gateway is a routing hub, and gateway endpoints are for private access to specific AWS services from inside a VPC. The access pattern here is remote users, not sites or services. Key rule: Remote end users from any location should use AWS Client VPN, not Site-to-Site VPN."
  ref: "Q008 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-working-target.html"
  exams: [saa-open]

- id: open-saa-q009
  kind: choice
  en: "A backend service in private subnets must read objects from Amazon S3, write session state to Amazon DynamoDB, and retrieve database credentials from AWS Secrets Manager. The architects want all three calls to stay on private AWS networking and want to minimize recurring endpoint charges. Which design should they implement?"
  options:
    - "Use gateway endpoints for Amazon S3 and DynamoDB, plus an interface endpoint for Secrets Manager"
    - "Use one NAT gateway for all three services"
    - "Use AWS Direct Connect for the application VPC"
    - "Use interface endpoints for Amazon S3, DynamoDB, and Secrets Manager"
  correct: [A]
  why: "Amazon S3 and DynamoDB are the classic gateway endpoint services, so using gateway endpoints for those two minimizes recurring endpoint cost while preserving private connectivity. AWS Secrets Manager requires an interface endpoint when you want private access from the VPC. Using interface endpoints for all three would work but would not be the lowest recurring-cost design, and NAT is still internet egress rather than private service access. The answer boundary is mixed service types with a cost constraint. Key rule: For the lowest-cost private mix, use gateway endpoints where available and interface endpoints only where required."
  ref: "Q009 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html ; https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-ddb.html"
  exams: [saa-open]

- id: open-saa-q010
  kind: choice
  en: "A managed service provider must let one consumer VPC reach a single internal HTTPS service. The consumer's CIDR range overlaps with the provider VPC, and the provider does not want to expose general network connectivity between the environments. Which option best satisfies the requirement?"
  options:
    - "Expose the service by using AWS PrivateLink"
    - "Create a VPC peering connection and exchange routes for the overlapping CIDRs"
    - "Attach both VPCs to the same transit gateway and share full routing"
    - "Route the traffic through a NAT gateway in the provider VPC"
  correct: [A]
  why: "AWS PrivateLink is the right fit because it publishes a specific service privately without requiring full network routing between the consumer and provider VPCs. VPC peering is not viable with overlapping CIDR ranges and would still create broader network connectivity than required. A transit gateway would also be broader than needed and does not solve the service-specific exposure requirement by itself. The decision turns on overlapping CIDRs plus least-privilege sharing of one service. Key rule: If overlapping VPCs only need one private service, use AWS PrivateLink instead of routed network connectivity."
  ref: "Q010 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/peering/invalid-peering-configurations.html"
  exams: [saa-open]

- id: open-saa-q011
  kind: choice
  en: "A media platform stores user-generated video clips in Amazon S3. For the first few weeks after upload, access is unpredictable and can spike suddenly. Months later, many objects become cold, but the team still wants automatic cost optimization without writing lifecycle rules for each pattern. Which storage class is the best fit?"
  options:
    - "S3 Intelligent-Tiering"
    - "S3 One Zone-IA"
    - "S3 Glacier Deep Archive"
    - "S3 Standard-IA"
  correct: [A]
  why: "S3 Intelligent-Tiering is designed for objects with changing or unknown access patterns because it automatically moves data between access tiers while preserving immediate retrieval when the object remains in the frequent or infrequent access tiers. Standard-IA assumes you already know the object will be infrequently accessed, and Deep Archive would not support the same immediate usability. The decision boundary is uncertainty in future access behavior, not simply low cost. Key rule: Unknown or changing S3 access patterns usually point to S3 Intelligent-Tiering."
  ref: "Q011 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering.html ; https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q012
  kind: choice
  en: "A training company keeps newly uploaded course recordings in Amazon S3 where they are watched heavily for about 45 days. After that, they are rarely viewed, but the support team must still be able to retrieve a file within a few hours when a customer dispute occurs. What is the most cost-effective design?"
  options:
    - "Transition objects to S3 Glacier Deep Archive after 45 days"
    - "Keep everything in S3 Standard permanently"
    - "Store all files in S3 One Zone-IA from day one"
    - "Transition objects from S3 Standard to S3 Glacier Flexible Retrieval with a lifecycle rule"
  correct: [D]
  why: "S3 Glacier Flexible Retrieval is appropriate when objects become cold after a predictable period and retrieval within minutes to hours is acceptable. A lifecycle rule lets the team keep the frequently accessed early period in S3 Standard and then reduce cost afterward. Deep Archive is optimized for much longer retrieval times, and One Zone-IA would reduce durability because the files are kept in only one Availability Zone. The key boundary is predictable aging plus non-immediate but still practical retrieval. Key rule: Known warm-to-cold S3 lifecycle with hours-level retrieval fits Standard then Glacier Flexible Retrieval."
  ref: "Q012 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html ; https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q013
  kind: choice
  en: "A legal archive must retain signed case evidence for seven years. Access is extremely rare, and the team accepts waiting up to 12 hours for retrieval when a file is requested. Which S3 storage class is the best fit?"
  options:
    - "S3 Glacier Deep Archive"
    - "S3 Glacier Instant Retrieval"
    - "S3 Intelligent-Tiering"
    - "S3 Standard-IA"
  correct: [A]
  why: "S3 Glacier Deep Archive is built for very rarely accessed long-term retention where the lowest storage cost is the priority and retrieval times of hours are acceptable. Glacier Instant Retrieval would preserve millisecond access, which is unnecessary here and typically more expensive for storage. Standard-IA and Intelligent-Tiering are both aimed at more active access patterns. The deciding boundary is very cold archival data with long retention and relaxed retrieval time. Key rule: Very cold long-term archives with hours-level retrieval tolerance belong in S3 Glacier Deep Archive."
  ref: "Q013 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q014
  kind: choice
  en: "A healthcare provider stores compliance evidence in Amazon S3 and must guarantee that no administrator, including the root user, can delete the records before the retention period expires. Which feature should be used?"
  options:
    - "S3 Versioning with MFA Delete"
    - "S3 Object Lock Compliance mode"
    - "S3 Object Lock Governance mode"
    - "S3 Lifecycle expiration rules"
  correct: [B]
  why: "S3 Object Lock Compliance mode prevents object deletion or retention reduction by any user, including the root user, until the retention period expires. Governance mode is still useful for controlled retention, but it allows appropriately privileged users to bypass the lock in some circumstances. Versioning and lifecycle rules do not create the same immutable compliance guarantee. The answer boundary is absolute WORM-style retention. Key rule: If nobody, including root, may delete the object early, use S3 Object Lock Compliance mode."
  ref: "Q014 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
  exams: [saa-open]

- id: open-saa-q015
  kind: choice
  en: "An analytics team stores partitioned Parquet files in Amazon S3 and wants to run ad hoc SQL queries directly against that data without provisioning or managing database servers. Which AWS service is the best fit?"
  options:
    - "AWS Glue DataBrew"
    - "Amazon RDS for PostgreSQL"
    - "Amazon Redshift"
    - "Amazon Athena"
  correct: [D]
  why: "Amazon Athena is a serverless query service that runs SQL directly against data in Amazon S3, making it a strong fit for ad hoc analytics with minimal operational work. Redshift can also analyze data, but it requires a warehouse model and more operational decisions. Glue helps with ETL and cataloging rather than being the direct query engine here. The critical boundary is direct SQL on S3 with minimal infrastructure management. Key rule: Ad hoc SQL directly on data in Amazon S3 with minimal ops means Amazon Athena."
  ref: "Q015 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/athena/latest/ug/querying-athena-tables.html"
  exams: [saa-open]

- id: open-saa-q016
  kind: choice
  en: "A semiconductor company must move 250 TB of design archives from an on-premises NAS environment into AWS within 10 days. Its available WAN bandwidth cannot meet the deadline even if fully saturated. Which AWS service is the most realistic choice?"
  options:
    - "AWS Snowball Edge"
    - "Amazon S3 Transfer Acceleration"
    - "A single Direct Connect hosted connection"
    - "AWS DataSync"
  correct: [A]
  why: "AWS Snowball Edge is the right option when the dataset is large enough that the network timeline is the limiting factor. DataSync and Transfer Acceleration still depend on available network bandwidth, and Direct Connect improves private connectivity but does not change the basic transfer math enough for a tight deadline of this size. The deciding factor is that physical transfer is required to hit the deadline. Key rule: When large data transfer deadlines break network math, use Snowball Edge."
  ref: "Q016 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/snowball/latest/developer-guide/using-device.html"
  exams: [saa-open]

- id: open-saa-q017
  kind: choice
  en: "A genomics workflow runs on many Linux EC2 instances and needs a shared file system with POSIX semantics, standard NFS access, and regional durability across multiple Availability Zones. Which service is the best fit?"
  options:
    - "Amazon S3"
    - "Amazon FSx for Windows File Server"
    - "Amazon EFS"
    - "Amazon EBS Multi-Attach"
  correct: [C]
  why: "Amazon EFS is the managed NFS file system for Linux workloads that need shared access and POSIX-compatible semantics across multiple instances in multiple Availability Zones. EBS Multi-Attach provides block storage and has a much narrower attachment model, while FSx for Windows targets SMB workloads. S3 is object storage, not a POSIX file system. The boundary is Linux shared file access with regional managed storage. Key rule: Shared Linux file storage with POSIX semantics across AZs points to Amazon EFS."
  ref: "Q017 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/efs/latest/ug/mounting-fs.html"
  exams: [saa-open]

- id: open-saa-q018
  kind: choice
  en: "A company is moving a Windows-based content management system to AWS. The application expects an SMB file share and native Microsoft Active Directory integration. Which managed file service best matches those requirements?"
  options:
    - "Amazon EFS"
    - "Amazon S3"
    - "Amazon FSx for Windows File Server"
    - "Amazon FSx for Lustre"
  correct: [C]
  why: "Amazon FSx for Windows File Server is purpose-built for Windows workloads that need SMB, NTFS permissions, and Active Directory integration. EFS is oriented around NFS and Linux-style shared file access, while S3 is object storage rather than a drop-in SMB file share. FSx for Lustre is aimed at high-performance compute workloads rather than Windows application file serving. The key boundary is managed Windows file storage. Key rule: Windows workloads needing SMB and Active Directory should use FSx for Windows File Server."
  ref: "Q018 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/supported-fsx-clients.html"
  exams: [saa-open]

- id: open-saa-q019
  kind: choice
  en: "An operations team wants to trigger near-real-time processing whenever new log objects arrive in Amazon S3. The downstream Lambda function can fail transiently, so the team wants durable buffering between S3 notifications and processing. Which architecture should they use?"
  options:
    - "S3 Event Notifications to Amazon SQS, then Lambda consumes from the queue"
    - "S3 Event Notifications directly to an internet gateway"
    - "S3 Cross-Region Replication to Lambda"
    - "S3 Lifecycle transition rules to Lambda"
  correct: [A]
  why: "Sending S3 event notifications to Amazon SQS creates a durable queue between object creation and Lambda processing. That buffering is useful when the consumer fails or must retry, because messages remain in the queue for later processing. Direct S3-to-Lambda invocation can be simpler, but it does not provide the same explicit queue-based retry buffer. The deciding requirement is durable event buffering before processing. Key rule: If S3-triggered processing needs durable buffering, put Amazon SQS between S3 and Lambda."
  ref: "Q019 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html ; https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html"
  exams: [saa-open]

- id: open-saa-q020
  kind: choice
  en: "A company is preparing Amazon S3 Cross-Region Replication for disaster recovery. Before replication can be enabled, what must be configured on both the source and destination buckets?"
  options:
    - "S3 Transfer Acceleration"
    - "S3 Versioning"
    - "S3 Object Lock"
    - "S3 Inventory"
  correct: [B]
  why: "S3 replication depends on versioning, and versioning must be enabled on both the source and destination buckets. Transfer Acceleration, Object Lock, and Inventory can all be useful in other scenarios, but they are not the prerequisite that makes replication function. The answer boundary is the required foundational feature, not an optional enhancement. Key rule: S3 replication requires versioning on both buckets."
  ref: "Q020 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html ; https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html"
  exams: [saa-open]

- id: open-saa-q021
  kind: choice
  en: "A compliance team needs to discover and classify sensitive personal data stored in Amazon S3 so it can investigate unexpected access patterns. Which AWS service is purpose-built for that job?"
  options:
    - "Amazon Inspector"
    - "Amazon GuardDuty"
    - "AWS Config"
    - "Amazon Macie"
  correct: [D]
  why: "Amazon Macie is designed to discover, classify, and help protect sensitive data in Amazon S3. GuardDuty focuses on threat detection, Inspector on workload vulnerability assessment, and Config on configuration state. The key requirement is content classification in S3, which is Macie’s domain. Key rule: Sensitive-data discovery and classification in Amazon S3 means Amazon Macie."
  ref: "Q021 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/macie/latest/user/discovery-jobs.html"
  exams: [saa-open]

- id: open-saa-q022
  kind: choice
  en: "An audit firm needs temporary access to a handful of evidence files in an Amazon S3 bucket. The bucket owner does not want to create IAM users or make the bucket public. Which mechanism is the best fit?"
  options:
    - "Generate S3 presigned URLs for the required objects"
    - "Publish the bucket through S3 website hosting"
    - "Create a new public bucket and copy the files"
    - "Enable S3 Transfer Acceleration"
  correct: [A]
  why: "Presigned URLs allow time-limited access to specific S3 objects without making the bucket public or provisioning long-lived external identities for the simple sharing need. Website hosting or public buckets would unnecessarily expose data more broadly. Transfer Acceleration improves upload/download performance but does not solve authorization. The decision boundary is limited-time, object-level sharing. Key rule: Short-lived external access to specific S3 objects is a presigned URL use case."
  ref: "Q022 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/ShareObjectPreSignedURL.html"
  exams: [saa-open]

- id: open-saa-q023
  kind: choice
  en: "A retailer keeps historical invoices for 18 months. They are read only a few times per quarter, but when a file is requested it must open immediately, and the company still wants multi-Availability Zone resilience. Which storage class is the best fit?"
  options:
    - "S3 Glacier Flexible Retrieval"
    - "S3 One Zone-IA"
    - "S3 Standard-IA"
    - "S3 Glacier Deep Archive"
  correct: [C]
  why: "S3 Standard-IA is designed for infrequently accessed data that still needs millisecond retrieval and standard multi-AZ resilience. One Zone-IA would reduce resiliency to a single Availability Zone, while Glacier classes trade away the immediate retrieval requirement. The deciding boundary is infrequent access with immediate use and multi-AZ durability. Key rule: Infrequent access plus instant retrieval plus multi-AZ durability usually means S3 Standard-IA."
  ref: "Q023 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q024
  kind: choice
  en: "A data science team stores regenerated feature files in Amazon S3. The files are not mission-critical because they can be rebuilt from source data, and the team wants to reduce storage cost while preserving millisecond retrieval. Which storage class is the best fit?"
  options:
    - "S3 Standard-IA"
    - "S3 Glacier Instant Retrieval"
    - "S3 One Zone-IA"
    - "S3 Standard"
  correct: [C]
  why: "S3 One Zone-IA trades multi-AZ resilience for lower storage cost and is a better fit when the data is infrequently accessed and can be recreated if needed. Standard-IA provides stronger resilience but at a higher cost profile for this scenario. Glacier Instant Retrieval is intended for archival-style objects rather than actively reusable secondary data sets. The boundary is recreatable data where single-AZ durability is acceptable. Key rule: Recreatable infrequently accessed data with instant access can fit S3 One Zone-IA."
  ref: "Q024 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q025
  kind: choice
  en: "A financial archive is accessed only during quarterly audits, but the audit team expects the files to open immediately when requested. The company wants lower storage cost than S3 Standard for this rarely accessed archive. Which storage class is the best match?"
  options:
    - "S3 Glacier Instant Retrieval"
    - "S3 One Zone-IA"
    - "S3 Glacier Flexible Retrieval"
    - "S3 Glacier Deep Archive"
  correct: [A]
  why: "S3 Glacier Instant Retrieval is for archival data that is rarely retrieved but still needs millisecond access. Glacier Flexible Retrieval and Deep Archive both assume slower retrieval workflows, so they do not fit the immediate-open requirement. One Zone-IA is not positioned as an archive-oriented class and reduces resilience. The critical boundary is archive economics with instant retrieval. Key rule: Rarely accessed archive data that still needs millisecond retrieval belongs in S3 Glacier Instant Retrieval."
  ref: "Q025 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"
  exams: [saa-open]

- id: open-saa-q026
  kind: choice
  en: "A visual effects studio needs a high-performance shared file system for Linux render nodes. The workload is throughput-intensive and the team also wants native integration with an Amazon S3 bucket that stores the source assets. Which service is the best fit?"
  options:
    - "Amazon S3 Glacier Flexible Retrieval"
    - "Amazon FSx for Windows File Server"
    - "Amazon EFS"
    - "Amazon FSx for Lustre"
  correct: [D]
  why: "Amazon FSx for Lustre is optimized for high-performance compute workloads and integrates with Amazon S3, making it a good fit for rendering, analytics, and HPC-style pipelines. EFS is a general-purpose shared file system but not the same high-performance parallel file system. FSx for Windows is aimed at SMB-based Windows workloads. The deciding boundary is HPC-style performance with S3-backed data sets. Key rule: High-performance compute file storage with S3 integration usually points to FSx for Lustre."
  ref: "Q026 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/fsx/latest/LustreGuide/create-fs-linked-data-repo.html"
  exams: [saa-open]

- id: open-saa-q027
  kind: choice
  en: "A company has 40 TB of files on an on-premises NFS server and wants to move them to AWS over the network while preserving metadata and minimizing custom scripting. Which service is the best fit?"
  options:
    - "AWS DataSync"
    - "AWS Snowball Edge"
    - "Amazon S3 Batch Operations"
    - "S3 presigned URLs"
  correct: [A]
  why: "AWS DataSync is purpose-built for moving large datasets between on-premises storage and AWS storage services over the network while handling transfer acceleration, validation, and metadata preservation. Snowball Edge is better when bandwidth limits make network transfer impractical, but the question does not establish that constraint here. S3 Batch Operations and presigned URLs solve different problems. The boundary is managed online migration of file data. Key rule: Managed network transfer of on-premises file data into AWS is an AWS DataSync use case."
  ref: "Q027 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/datasync/latest/userguide/how-datasync-works.html"
  exams: [saa-open]

- id: open-saa-q028
  kind: choice
  en: "A company already stores 180 TB of historical content in Amazon S3 Standard. It wants to move that content into a lower-cost archival class over time, and the team does not want the transition to consume on-premises or branch-office network bandwidth. Which approach is the most efficient?"
  options:
    - "Use an S3 lifecycle transition rule"
    - "Copy the objects back to an on-premises server and re-upload them to the archival class"
    - "Route the transition through S3 Transfer Acceleration"
    - "Export the data with Snowball Edge and re-import it"
  correct: [A]
  why: "If the data is already in Amazon S3, the cleanest and most efficient way to move it to another S3 storage class is an S3 lifecycle transition rule. That transition occurs inside AWS and does not require external network bandwidth. Snowball and Transfer Acceleration are transfer tools, not the right answer for an in-place storage-class move. The boundary is existing S3-resident data that only needs tiering. Key rule: If the data is already in S3 and only the storage class must change, use lifecycle transitions."
  ref: "Q028 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html"
  exams: [saa-open]

- id: open-saa-q029
  kind: choice
  en: "A software vendor collects multi-gigabyte diagnostic bundles from customers worldwide into a single Amazon S3 bucket. Upload performance from distant regions is inconsistent, and the vendor wants an AWS-managed feature to accelerate long-distance transfers. Which option should it use?"
  options:
    - "Amazon S3 Transfer Acceleration"
    - "Amazon Athena"
    - "Amazon Macie"
    - "S3 Object Lock"
  correct: [A]
  why: "S3 Transfer Acceleration is designed to improve transfer performance to an S3 bucket over long geographic distances by using optimized network paths. Macie, Athena, and Object Lock address data classification, analytics, and retention rather than upload performance. The deciding requirement is faster global transfer into S3, not storage governance or query. Key rule: Global long-distance uploads into one S3 bucket point to S3 Transfer Acceleration."
  ref: "Q029 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html"
  exams: [saa-open]

- id: open-saa-q030
  kind: choice
  en: "A design firm wants branch office users to keep working with standard file shares while files are ultimately stored durably in AWS. The users expect low-latency local access to recently used files, and the team does not want to rewrite applications for object APIs. Which service is the best fit?"
  options:
    - "AWS Storage Gateway File Gateway"
    - "Amazon S3 Glacier Deep Archive"
    - "Amazon Athena"
    - "Amazon FSx for Lustre"
  correct: [A]
  why: "AWS Storage Gateway File Gateway presents NFS or SMB file shares locally while storing the objects in Amazon S3 and caching active data on premises for low-latency access. That makes it a better fit than asking users to interact directly with object storage. FSx for Lustre is a high-performance file system for compute workloads, not branch file gatewaying. The key boundary is legacy file-share access backed by S3. Key rule: If users need local file-share semantics with S3 as the durable backend, use File Gateway."
  ref: "Q030 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/storagegateway/latest/userguide/file-gateway-concepts.html"
  exams: [saa-open]

- id: open-saa-q031
  kind: choice
  en: "A clustered database appliance runs on several EC2 instances in one Availability Zone and needs shared block storage attached to multiple instances at the same time. Which storage feature is designed for that use case?"
  options:
    - "Amazon EFS"
    - "Amazon EBS Multi-Attach"
    - "Amazon S3 Standard"
    - "Amazon FSx for Windows File Server"
  correct: [B]
  why: "Amazon EBS Multi-Attach is the feature for attaching a single provisioned IOPS EBS volume to multiple EC2 instances in the same Availability Zone. EFS is shared file storage rather than shared block storage, and S3 is object storage. FSx for Windows provides SMB file shares, which is also a different access model. The deciding boundary is shared block storage, not shared files. Key rule: Shared block storage for multiple EC2 instances in one AZ points to EBS Multi-Attach."
  ref: "Q031 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html"
  exams: [saa-open]

- id: open-saa-q032
  kind: choice
  en: "An investigations team must freeze selected Amazon S3 objects immediately because of pending litigation. The hold should remain until the legal team explicitly removes it, regardless of the normal retention schedule. Which S3 capability should be used?"
  options:
    - "S3 lifecycle expiration"
    - "S3 Transfer Acceleration"
    - "S3 Intelligent-Tiering archive access tier"
    - "S3 Object Lock legal hold"
  correct: [D]
  why: "An S3 Object Lock legal hold is specifically intended to prevent deletion of an object until the hold is removed, independent of a time-based retention period. Lifecycle rules do the opposite by automating deletion or transitions. Intelligent-Tiering and Transfer Acceleration are unrelated to legal preservation. The decision boundary is an indefinite hold controlled by legal workflow rather than by a preset retention clock. Key rule: If the object must be frozen until someone explicitly releases it, use an S3 Object Lock legal hold."
  ref: "Q032 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html ; https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
  exams: [saa-open]

- id: open-saa-q033
  kind: choice
  en: "A manufacturing platform needs one managed file service that can present NFS to Linux applications, SMB to Windows applications, and also provide enterprise data management features such as snapshots and clones. Which AWS service is the best fit?"
  options:
    - "Amazon FSx for NetApp ONTAP"
    - "Amazon S3 Standard"
    - "Amazon FSx for Lustre"
    - "Amazon EFS"
  correct: [A]
  why: "Amazon FSx for NetApp ONTAP supports multiprotocol access patterns and enterprise-style data management features such as snapshots and cloning. EFS is NFS-focused and does not provide the same multiprotocol ONTAP model. FSx for Lustre is targeted at high-performance compute use cases instead. The answer boundary is a managed multiprotocol enterprise file platform. Key rule: If one managed file service must serve both NFS and SMB with advanced data management, use FSx for NetApp ONTAP."
  ref: "Q033 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/accessing-data.html"
  exams: [saa-open]

- id: open-saa-q034
  kind: choice
  en: "A company needs to apply a new tag and invoke an operation across tens of millions of objects already stored in Amazon S3. The team wants a managed bulk mechanism rather than writing custom loops to list and process every key. Which feature should it use?"
  options:
    - "S3 presigned URLs"
    - "Amazon Macie"
    - "Amazon Athena"
    - "Amazon S3 Batch Operations"
  correct: [D]
  why: "Amazon S3 Batch Operations is built for performing large-scale actions across many S3 objects using a managed job model. Athena queries data; Macie classifies sensitive content; presigned URLs share individual objects. The deciding boundary is a managed bulk action across an existing object population. Key rule: Managed bulk actions across millions of S3 objects belong to S3 Batch Operations."
  ref: "Q034 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops.html"
  exams: [saa-open]

- id: open-saa-q035
  kind: choice
  en: "A platform team wants one AWS-native service to define backup policies centrally and protect Amazon EBS volumes, Amazon EFS file systems, and Amazon RDS databases across accounts. Which service is the best fit?"
  options:
    - "AWS Backup"
    - "AWS DataSync"
    - "Amazon Macie"
    - "Amazon S3 Inventory"
  correct: [A]
  why: "AWS Backup is the centralized managed service for defining backup plans and applying them across supported AWS services, including EBS, EFS, and RDS. S3 Inventory reports object metadata, Macie classifies S3 content, and DataSync moves data. The key requirement is centralized policy-based backup management across multiple AWS storage services. Key rule: Centralized policy-based backups across multiple AWS storage services point to AWS Backup."
  ref: "Q035 (Storage) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/aws-backup/latest/devguide/creating-a-backup-plan.html"
  exams: [saa-open]

- id: open-saa-q036
  kind: choice
  en: "A merchandising application uses Amazon RDS for MySQL for transactional writes. A separate reporting team runs heavy read-only queries that slow down the checkout path, but the company does not want to change database engines. Which design is the best fit?"
  options:
    - "Move the reporting queries into Amazon S3 Glacier Flexible Retrieval"
    - "Add a NAT gateway to the database subnet"
    - "Create one or more read replicas and send reporting traffic there"
    - "Enable Multi-AZ on the DB instance"
  correct: [C]
  why: "Read replicas are used to offload read-heavy workloads from the primary relational database instance. Multi-AZ improves availability and failover but does not serve the same role for scaling read traffic in the standard RDS instance deployment model. The deciding boundary is read scaling for reporting without changing engines. Key rule: Read-heavy reporting on RDS usually means read replicas, not Multi-AZ."
  ref: "Q036 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html"
  exams: [saa-open]

- id: open-saa-q037
  kind: choice
  en: "A payment service stores orders in Amazon RDS for PostgreSQL. The architects need automatic failover to a standby instance in another Availability Zone, but the application does not need extra read capacity. Which feature should they choose?"
  options:
    - "Amazon Redshift"
    - "Read replicas"
    - "Multi-AZ deployment"
    - "Amazon ElastiCache"
  correct: [C]
  why: "A Multi-AZ deployment is the high-availability feature for a relational database that needs synchronous standby failover in another Availability Zone. Read replicas are for offloading reads, not for the same standby failover objective. Redshift and ElastiCache solve different analytics and caching problems. The decision boundary is high availability without a read-scaling requirement. Key rule: HA failover for RDS without read scaling points to Multi-AZ."
  ref: "Q037 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html"
  exams: [saa-open]

- id: open-saa-q038
  kind: choice
  en: "An API tier built with AWS Lambda opens large numbers of short-lived connections to an Amazon RDS for MySQL database. During sudden traffic spikes, the database spends too much time handling connection churn. Which AWS service is designed to help with this problem?"
  options:
    - "Amazon RDS Proxy"
    - "Amazon Neptune"
    - "AWS Schema Conversion Tool"
    - "Amazon DynamoDB global tables"
  correct: [A]
  why: "Amazon RDS Proxy pools and shares database connections, which is especially useful when highly elastic compute such as Lambda creates bursts of connection requests. Global tables, SCT, and Neptune address different database problems. The answer boundary is connection management for a relational database, not engine conversion or graph traversal. Key rule: Bursting Lambda-to-RDS connection churn points to Amazon RDS Proxy."
  ref: "Q038 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html"
  exams: [saa-open]

- id: open-saa-q039
  kind: choice
  en: "A gaming leaderboard stores player state in Amazon DynamoDB. The application needs microsecond-level latency for hot, eventually consistent reads during peak match activity. Which service is the best fit?"
  options:
    - "AWS Database Migration Service"
    - "Amazon RDS Proxy"
    - "DynamoDB Accelerator (DAX)"
    - "Amazon Aurora reader endpoint"
  correct: [C]
  why: "DynamoDB Accelerator (DAX) is the in-memory cache that is API-compatible with DynamoDB and is built to reduce read latency from single-digit milliseconds to microseconds for suitable eventually consistent workloads. Aurora reader endpoints and RDS Proxy are relational features, and DMS is a migration tool. The key boundary is microsecond read acceleration for DynamoDB. Key rule: Microsecond eventually consistent reads on DynamoDB point to DAX."
  ref: "Q039 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html ; https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.html"
  exams: [saa-open]

- id: open-saa-q040
  kind: choice
  en: "A ticketing platform expects sudden, unpredictable traffic spikes during product launches. The developers want a serverless NoSQL database that can absorb large demand changes without capacity planning. Which service configuration is the best fit?"
  options:
    - "Amazon DocumentDB"
    - "Amazon RDS for PostgreSQL with read replicas"
    - "Amazon DynamoDB on-demand mode"
    - "Amazon Redshift Serverless"
  correct: [C]
  why: "DynamoDB on-demand mode is intended for workloads with unpredictable traffic because it removes throughput capacity planning and scales automatically with demand. RDS with replicas is still relational infrastructure, Redshift is an analytics warehouse, and DocumentDB is a document database. The decision boundary is serverless key-value/document-style access with unpredictable request volume. Key rule: Unpredictable NoSQL traffic without capacity planning points to DynamoDB on-demand."
  ref: "Q040 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html"
  exams: [saa-open]

- id: open-saa-q041
  kind: choice
  en: "A QA team needs a full copy of a 20 TB Amazon Aurora database for testing. The copy must be created quickly and with minimal extra storage at the moment of creation. Which Aurora feature best fits?"
  options:
    - "AWS DMS full load"
    - "Aurora cloning"
    - "Snapshot export to Amazon S3"
    - "Read replica promotion"
  correct: [B]
  why: "Aurora cloning uses a copy-on-write model so a new cluster can be created quickly while initially sharing the same underlying data pages. That is much faster and more space-efficient than making a full physical copy up front. A promoted read replica is not the same as creating an independent test copy from a clone. The deciding boundary is rapid full-environment cloning with minimal initial storage overhead. Key rule: Fast full Aurora copies with copy-on-write behavior mean Aurora cloning."
  ref: "Q041 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Clone.html"
  exams: [saa-open]

- id: open-saa-q042
  kind: choice
  en: "An application uses Amazon Aurora MySQL with several replicas. The developers want one endpoint that automatically distributes read-only sessions across available replicas. Which Aurora feature should they use?"
  options:
    - "Custom VPC endpoint"
    - "Reader endpoint"
    - "Writer endpoint"
    - "RDS Proxy endpoint"
  correct: [B]
  why: "The Aurora reader endpoint balances read-only connections across Aurora replicas, which reduces read load on the writer instance. The writer endpoint is for write traffic to the primary instance. RDS Proxy can still be useful in some designs, but it is not the native Aurora feature that answers this exact read distribution requirement. The boundary is built-in Aurora read balancing. Key rule: Single endpoint for Aurora read traffic means the reader endpoint."
  ref: "Q042 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Reader.html"
  exams: [saa-open]

- id: open-saa-q043
  kind: choice
  en: "A global commerce platform needs one relational database with a primary Region for writes, fast local reads in other Regions, and a recovery strategy for a full-Region outage. Which Aurora feature is the best fit?"
  options:
    - "Aurora Global Database"
    - "Aurora cloning"
    - "Multi-AZ DB instance deployment"
    - "RDS storage autoscaling"
  correct: [A]
  why: "Aurora Global Database is designed for multi-Region relational deployments with one primary Region and one or more secondary Regions that can provide local reads and improve disaster recovery posture. Multi-AZ covers Availability Zone failover inside a Region, not multi-Region read locality and failover. Cloning and storage autoscaling solve unrelated problems. The key boundary is global relational reads plus Region-level resilience. Key rule: Multi-Region Aurora with local reads and Region DR means Aurora Global Database."
  ref: "Q043 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"
  exams: [saa-open]

- id: open-saa-q044
  kind: choice
  en: "A SaaS team wants a MySQL-compatible relational database for highly variable tenant traffic. The database should scale capacity automatically and bill based on actual usage rather than a fixed instance size. Which option is the best fit?"
  options:
    - "Amazon RDS Multi-AZ"
    - "Amazon ElastiCache Serverless"
    - "Amazon Redshift Serverless"
    - "Amazon Aurora Serverless v2"
  correct: [D]
  why: "Aurora Serverless v2 is the autoscaling Aurora deployment option for variable relational workloads and is charged based on consumed capacity rather than a fixed provisioned size. Standard RDS Multi-AZ is a high-availability deployment pattern, not an on-demand autoscaling relational capacity model. Redshift and ElastiCache solve analytics and caching problems instead. The boundary is variable relational demand with Aurora compatibility. Key rule: Variable relational demand with Aurora compatibility points to Aurora Serverless v2."
  ref: "Q044 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html ; https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html"
  exams: [saa-open]

- id: open-saa-q045
  kind: choice
  en: "A BI team needs to run complex SQL analytics across several terabytes of historical sales data with a warehouse-style schema. The workload is analytical, not transactional, and the team wants a managed columnar data warehouse. Which service is the best fit?"
  options:
    - "Amazon Neptune"
    - "Amazon DynamoDB"
    - "Amazon Aurora PostgreSQL"
    - "Amazon Redshift"
  correct: [D]
  why: "Amazon Redshift is the managed data warehouse service for large-scale SQL analytics. DynamoDB is NoSQL, Aurora is a transactional relational database, and Neptune is for graph data. The deciding factor is warehouse-style analytics over large datasets rather than OLTP processing. Key rule: Petabyte-scale SQL analytics and warehousing point to Amazon Redshift."
  ref: "Q045 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/redshift/latest/dg/c_high_level_system_architecture.html"
  exams: [saa-open]

- id: open-saa-q046
  kind: choice
  en: "A company plans to move an Oracle database to Aurora PostgreSQL. Before any data migration starts, the architects want an assessment of schema conversion complexity and an automated way to convert as much schema as possible. Which AWS tool should they run first?"
  options:
    - "Amazon Redshift Spectrum"
    - "Amazon RDS Proxy"
    - "AWS Schema Conversion Tool"
    - "AWS Database Migration Service"
  correct: [C]
  why: "AWS Schema Conversion Tool is the tool for assessing and converting schema when moving between heterogeneous database engines. DMS handles data movement and ongoing replication, but schema conversion analysis is the first step here. RDS Proxy and Redshift Spectrum solve entirely different problems. The boundary is schema assessment and conversion before data movement. Key rule: Heterogeneous schema conversion analysis starts with AWS SCT."
  ref: "Q046 (Migration) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/SchemaConversionTool/latest/userguide/CHAP_Converting.Convert.html"
  exams: [saa-open]

- id: open-saa-q047
  kind: choice
  en: "A production PostgreSQL database must be migrated to Amazon Aurora PostgreSQL with minimal downtime. The initial bulk data load can happen before cutover, but ongoing changes must continue to replicate until the final switch. Which AWS DMS capability is required?"
  options:
    - "RDS read replica creation"
    - "Aurora cloning"
    - "Change data capture (CDC)"
    - "DynamoDB point-in-time recovery"
  correct: [C]
  why: "Change data capture (CDC) in AWS DMS is the feature that keeps ongoing source changes flowing to the target during a low-downtime migration. Read replicas and Aurora cloning are not generic migration mechanisms across engines or environments. PITR is for recovery, not live migration. The answer boundary is continuous replication of changes after the initial load. Key rule: Low-downtime database migration after full load requires DMS CDC."
  ref: "Q047 (Migration) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html"
  exams: [saa-open]

- id: open-saa-q048
  kind: choice
  en: "A mobile game needs a globally distributed NoSQL database where players in North America and Europe can both read and write locally. The data must replicate automatically across Regions. Which feature is the best fit?"
  options:
    - "DynamoDB global tables"
    - "Amazon Redshift data sharing"
    - "Aurora Global Database"
    - "RDS Multi-AZ"
  correct: [A]
  why: "DynamoDB global tables provide multi-Region, multi-active replication with local read and write capability in each replica Region. RDS Multi-AZ is regional high availability, and Aurora Global Database uses a primary Region with read-only secondary Regions in the normal design. Redshift data sharing is for analytics. The decision boundary is multi-active global NoSQL writes. Key rule: Multi-Region multi-active writes on NoSQL data point to DynamoDB global tables."
  ref: "Q048 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html"
  exams: [saa-open]

- id: open-saa-q049
  kind: choice
  en: "An operations engineer accidentally deletes several items from a DynamoDB table. The team wants the ability to restore the table to its state from a few hours earlier without having to manage backup jobs manually. Which feature should be enabled?"
  options:
    - "DynamoDB global tables"
    - "DynamoDB Accelerator (DAX)"
    - "DynamoDB point-in-time recovery"
    - "Amazon RDS automated backups"
  correct: [C]
  why: "DynamoDB point-in-time recovery provides continuous backups and lets you restore to any second within the recovery window without managing a manual backup schedule. Global tables replicate writes but are not the recovery control for this requirement. DAX is a cache, and RDS backups are not part of DynamoDB. The key boundary is managed continuous table recovery. Key rule: Restore a DynamoDB table to an earlier second by enabling PITR."
  ref: "Q049 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html ; https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/pointintimerecovery_restores.html"
  exams: [saa-open]

- id: open-saa-q050
  kind: choice
  en: "A development team uses MongoDB-compatible drivers and stores flexible JSON-like application documents. It wants a fully managed AWS database that preserves that programming model without redesigning the application into tables. Which service is the best fit?"
  options:
    - "Amazon Redshift"
    - "Amazon RDS for SQL Server"
    - "Amazon Neptune"
    - "Amazon DocumentDB (with MongoDB compatibility)"
  correct: [D]
  why: "Amazon DocumentDB is the managed AWS document database service designed for MongoDB-compatible application patterns. Neptune is for graph workloads, RDS for SQL Server is relational, and Redshift is a warehouse. The key boundary is flexible document storage with MongoDB compatibility. Key rule: Managed MongoDB-compatible document workloads point to Amazon DocumentDB."
  ref: "Q050 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/documentdb/latest/developerguide/mongo-apis.html"
  exams: [saa-open]

- id: open-saa-q051
  kind: choice
  en: "A fraud detection platform needs to model complex relationships among accounts, devices, merchants, and transactions. The queries must traverse many connected edges efficiently. Which AWS database service is the best fit?"
  options:
    - "Amazon Aurora MySQL"
    - "Amazon ElastiCache"
    - "Amazon Neptune"
    - "Amazon DynamoDB"
  correct: [C]
  why: "Amazon Neptune is the graph database service for highly connected data and relationship traversal. Aurora and DynamoDB can store the data, but they are not purpose-built for efficient graph traversal across billions of relationships. ElastiCache is an in-memory cache, not the system of record here. The answer boundary is graph-shaped data and relationship-centric queries. Key rule: Highly connected relationship queries point to Amazon Neptune."
  ref: "Q051 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html"
  exams: [saa-open]

- id: open-saa-q052
  kind: choice
  en: "A self-managed application is moved onto Amazon RDS for PostgreSQL. The engine must stay the same, but the team wants the storage volume to grow automatically when free space gets low. Which RDS capability should be enabled?"
  options:
    - "Aurora Global Database"
    - "Read replicas"
    - "RDS storage autoscaling"
    - "DynamoDB on-demand mode"
  correct: [C]
  why: "RDS storage autoscaling increases allocated storage automatically when an RDS instance is running low on free space. Read replicas scale reads, Aurora Global Database is a multi-Region Aurora feature, and DynamoDB on-demand is a NoSQL throughput mode. The boundary is automatic storage growth on a standard RDS instance. Key rule: Automatic storage growth on an RDS instance means RDS storage autoscaling."
  ref: "Q052 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html"
  exams: [saa-open]

- id: open-saa-q053
  kind: choice
  en: "An e-commerce site needs a fully managed in-memory layer to cache hot catalog data and reduce read load on its primary database. The cache should improve response time for frequently requested items but is not the system of record. Which AWS service is the best fit?"
  options:
    - "AWS Schema Conversion Tool"
    - "Amazon ElastiCache"
    - "Amazon Neptune"
    - "Amazon Redshift"
  correct: [B]
  why: "Amazon ElastiCache is the managed in-memory caching service used to speed up frequently accessed data and reduce load on the primary database. Neptune, Redshift, and SCT address graph storage, warehousing, and schema conversion instead. The deciding requirement is a managed cache, not a primary database engine. Key rule: If the requirement is a managed in-memory cache in front of a database, use Amazon ElastiCache."
  ref: "Q053 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html"
  exams: [saa-open]

- id: open-saa-q054
  kind: choice
  en: "A SaaS vendor needs a PostgreSQL-compatible managed database with automatic storage growth, built-in replication, and capacity for large relational datasets well beyond the limits of a typical single RDS instance. Which service is the best fit?"
  options:
    - "Amazon DynamoDB"
    - "Amazon Neptune"
    - "Amazon ElastiCache"
    - "Amazon Aurora PostgreSQL-Compatible Edition"
  correct: [D]
  why: "Aurora PostgreSQL is the managed PostgreSQL-compatible service with a shared storage architecture, automatic storage growth, and large-scale relational capabilities. DynamoDB is NoSQL, ElastiCache is caching, and Neptune is graph. The key boundary is PostgreSQL compatibility plus Aurora-style scaling characteristics. Key rule: Large-scale PostgreSQL-compatible managed relational workloads point to Aurora PostgreSQL."
  ref: "Q054 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Performance.html#Aurora.Managing.Performance.StorageScaling"
  exams: [saa-open]

- id: open-saa-q055
  kind: choice
  en: "A company has a licensed Oracle workload with stored procedures and vendor certification requirements that depend on staying on Oracle. It wants AWS to manage backups, patching, and infrastructure. Which service is the best fit?"
  options:
    - "Amazon DocumentDB"
    - "Amazon Aurora MySQL"
    - "Amazon RDS for Oracle"
    - "AWS Database Migration Service"
  correct: [C]
  why: "Amazon RDS for Oracle is the managed Oracle database option when the workload must remain on Oracle. Aurora MySQL changes engines, DMS is a migration service rather than the target runtime, and DocumentDB is document-oriented. The answer boundary is managed Oracle without engine change. Key rule: If the workload must remain Oracle but be managed by AWS, use Amazon RDS for Oracle."
  ref: "Q055 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Oracle.html"
  exams: [saa-open]

- id: open-saa-q056
  kind: choice
  en: "A team restores a DynamoDB table by using point-in-time recovery after accidental deletion. What is the behavior of the restore operation?"
  options:
    - "It restores the data into a new table"
    - "It rewinds the existing table in place"
    - "It requires DAX to be enabled first"
    - "It restores only to the latest backup, not a selected time"
  correct: [A]
  why: "DynamoDB point-in-time recovery restores data to a new table rather than rewinding the source table in place. That distinction matters for operational planning, IAM permissions, and cutover. DAX is unrelated, and the whole point of PITR is selecting a previous point in time. The boundary is restore semantics, not just recovery availability. Key rule: DynamoDB PITR restores into a new table, not the existing one."
  ref: "Q056 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/pointintimerecovery_restores.html"
  exams: [saa-open]

- id: open-saa-q057
  kind: choice
  en: "A MySQL-compatible workload needs regional high availability and also wants readable standby instances for read traffic in the same Region, using the newer Amazon RDS deployment model rather than classic single-standby Multi-AZ. Which option best fits?"
  options:
    - "Aurora Global Database"
    - "Read replicas only"
    - "Single-standby Multi-AZ DB instance deployment"
    - "Multi-AZ DB cluster deployment for Amazon RDS"
  correct: [D]
  why: "A Multi-AZ DB cluster deployment for Amazon RDS provides a writer plus readable standbys across three Availability Zones, combining high availability with additional read capacity. The classic single-standby Multi-AZ DB instance deployment provides failover but not the same readable-standby model. Read replicas alone are not the same HA deployment pattern. The answer boundary is the newer RDS Multi-AZ cluster model with readable standbys. Key rule: RDS HA plus readable standbys in three AZs points to a Multi-AZ DB cluster deployment."
  ref: "Q057 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html ; https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"
  exams: [saa-open]

- id: open-saa-q058
  kind: choice
  en: "A startup stores user sessions in a relational database, but the read workload is simple key-based retrieval and the data is short-lived. The team wants to reduce latency and avoid using the relational database as the primary session store. Which option is the best fit?"
  options:
    - "Use AWS SCT to convert the schema"
    - "Keep sessions only in Amazon RDS Multi-AZ"
    - "Use Amazon Redshift Serverless"
    - "Use Amazon ElastiCache as the session store/cache layer"
  correct: [D]
  why: "Session data with simple access patterns and low-latency needs is a typical fit for an in-memory cache such as Amazon ElastiCache. Keeping that workload in the primary relational store creates unnecessary overhead. AWS SCT and Redshift solve migration and analytics problems instead. The decision boundary is ephemeral, latency-sensitive session state rather than durable relational transactions. Key rule: Latency-sensitive session state is usually better in ElastiCache than in the primary relational database."
  ref: "Q058 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html"
  exams: [saa-open]

- id: open-saa-q059
  kind: choice
  en: "A finance team runs warehouse-style analytics only a few times per day. They want the simplicity of a managed analytics service without keeping a provisioned data warehouse running all day when idle. Which AWS option is the best fit?"
  options:
    - "Amazon RDS Proxy"
    - "Amazon Redshift Serverless"
    - "DynamoDB on-demand mode"
    - "Amazon Neptune"
  correct: [B]
  why: "Amazon Redshift Serverless is intended for analytics workloads that benefit from managed warehouse capacity without the overhead of maintaining provisioned clusters all the time. RDS Proxy, Neptune, and DynamoDB on-demand solve connection pooling, graph storage, and NoSQL request scaling. The key boundary is intermittent analytical warehousing. Key rule: Intermittent SQL warehouse workloads point to Amazon Redshift Serverless."
  ref: "Q059 (Database) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-workgroup-create.html"
  exams: [saa-open]

- id: open-saa-q060
  kind: choice
  en: "A team is migrating a self-managed PostgreSQL database to Amazon RDS for PostgreSQL. Because the source and target use the same engine family, the team wants AWS-managed migration tooling rather than schema conversion for a different engine. Which AWS capability is the best fit?"
  options:
    - "Amazon Neptune bulk loader"
    - "AWS DMS homogeneous data migration"
    - "AWS Schema Conversion Tool only"
    - "Aurora cloning"
  correct: [B]
  why: "For same-engine PostgreSQL migrations, AWS DMS homogeneous data migration is designed to handle the move with AWS-managed migration workflows. SCT is most valuable when schema conversion between different engines is required, which is not the main need here. Neptune and Aurora cloning are unrelated. The boundary is same-engine migration rather than heterogeneous conversion. Key rule: Same-engine PostgreSQL migration points to AWS DMS homogeneous migration, not SCT-led schema conversion."
  ref: "Q060 (Migration) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/dms/latest/userguide/dm-migrating-data-postgresql.html"
  exams: [saa-open]

- id: open-saa-q061
  kind: choice
  en: "A team runs workloads on Amazon EC2 and wants applications to call AWS APIs without storing long-term access keys on the instances. Which IAM approach is the best fit?"
  options:
    - "Create one shared IAM user and copy its access keys to every instance"
    - "Attach an IAM role to the EC2 instances by using an instance profile"
    - "Store root account access keys in AWS Systems Manager Parameter Store"
    - "Generate access keys for each developer and reuse them on the instances"
  correct: [B]
  why: "An IAM role attached through an instance profile gives EC2 instances temporary credentials automatically, which avoids distributing long-term access keys. Shared IAM users and root keys create unnecessary credential risk. The key boundary is machine-to-AWS API access without embedded static credentials. Key rule: EC2 workloads should use IAM roles, not long-term access keys."
  ref: "Q061 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html ; https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html"
  exams: [saa-open]

- id: open-saa-q062
  kind: choice
  en: "A finance account must let analysts in a separate analytics account read specific cost reports, but the finance team does not want to create duplicate IAM users in the finance account. Which design is the best fit?"
  options:
    - "Allow the analytics users to assume a role in the finance account"
    - "Use a NAT gateway to forward identity traffic between the accounts"
    - "Create IAM users in both accounts and synchronize passwords manually"
    - "Share the finance account root credentials with the analytics team"
  correct: [A]
  why: "Cross-account role assumption is the standard IAM pattern when users in one AWS account need controlled access to resources in another account. It avoids duplicating identities and keeps permissions centralized in the target account. Root credential sharing and duplicate users are both weaker security patterns. The deciding boundary is controlled cross-account access. Key rule: Cross-account access for users should usually be implemented with AssumeRole."
  ref: "Q062 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_common-scenarios_aws-accounts.html ; https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html"
  exams: [saa-open]

- id: open-saa-q063
  kind: choice
  en: "An organization wants to make sure member accounts can never disable Amazon GuardDuty, even if an account administrator creates an overly permissive IAM policy locally. Which control should be used?"
  options:
    - "An EC2 security group"
    - "A bucket policy on the GuardDuty service"
    - "A permissions boundary on each IAM user"
    - "An AWS Organizations service control policy (SCP)"
  correct: [D]
  why: "An SCP sets the maximum available permissions for principals in member accounts and is the right organization-wide guardrail when local admins must not be able to bypass the restriction. A permissions boundary is useful within one account, but it does not provide the same organization-level maximum-permission control. The key boundary is org-wide preventive control across accounts. Key rule: If the restriction must apply across member accounts regardless of local IAM policies, use an SCP."
  ref: "Q063 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"
  exams: [saa-open]

- id: open-saa-q064
  kind: choice
  en: "A platform team delegates IAM role creation to application teams, but it must guarantee that any permissions those teams grant remain inside an approved ceiling. Which IAM feature is designed for that requirement?"
  options:
    - "AWS WAF web ACLs"
    - "Route tables"
    - "Resource-based policies only"
    - "Permissions boundaries"
  correct: [D]
  why: "Permissions boundaries define the maximum permissions an IAM principal can receive, even if identity policies try to grant more. That makes them useful for delegated administration scenarios where teams can create roles but must remain within a preapproved limit. Resource policies and WAF do not solve the same principal permission ceiling problem. The boundary is delegated IAM administration with a hard cap. Key rule: Delegated IAM creation with a maximum permission ceiling points to permissions boundaries."
  ref: "Q064 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html"
  exams: [saa-open]

- id: open-saa-q065
  kind: choice
  en: "A security team wants to identify S3 buckets and KMS keys that are reachable from outside the organization because of resource policies or grants. Which AWS service is purpose-built to analyze that type of external access?"
  options:
    - "Amazon Redshift"
    - "AWS Shield Advanced"
    - "Amazon Inspector"
    - "AWS IAM Access Analyzer"
  correct: [D]
  why: "IAM Access Analyzer evaluates resource policies and related access paths to identify resources that can be accessed from outside a trusted zone such as the organization or account. Inspector focuses on vulnerability findings for compute resources and images, while Shield Advanced is DDoS protection. The deciding boundary is policy-based external access analysis. Key rule: To find externally reachable resources from policies, use IAM Access Analyzer."
  ref: "Q065 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-resources.html"
  exams: [saa-open]

- id: open-saa-q066
  kind: choice
  en: "A service must encrypt large files before storing them. The team wants to minimize calls to AWS KMS while still protecting each data object with a unique data key. Which AWS KMS pattern is the best fit?"
  options:
    - "S3 Transfer Acceleration"
    - "A single hard-coded application key"
    - "Envelope encryption"
    - "Client-side gzip compression"
  correct: [C]
  why: "Envelope encryption uses KMS-protected data keys so applications can encrypt large amounts of data efficiently while KMS protects the master key material. Hard-coded keys and unrelated transfer features do not solve the same cryptographic design problem. The key boundary is scalable encryption of large data while limiting direct KMS use on every byte. Key rule: For efficient large-scale encryption with KMS-protected keys, use envelope encryption."
  ref: "Q066 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html ; https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html"
  exams: [saa-open]

- id: open-saa-q067
  kind: choice
  en: "An application stores database credentials in AWS and needs those credentials rotated automatically on a schedule. Which AWS service is the best fit?"
  options:
    - "AWS Secrets Manager"
    - "Amazon S3 Inventory"
    - "Amazon Athena"
    - "AWS Systems Manager Parameter Store standard parameters"
  correct: [A]
  why: "AWS Secrets Manager is designed for storing, retrieving, and rotating secrets such as database credentials. Parameter Store can store values, but automatic secret rotation is a core Secrets Manager capability. S3 Inventory and Athena are unrelated. The answer boundary is secret lifecycle management with rotation. Key rule: If the requirement includes managed secret rotation, choose AWS Secrets Manager."
  ref: "Q067 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html ; https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"
  exams: [saa-open]

- id: open-saa-q068
  kind: choice
  en: "A security baseline requires database credentials to rotate every 30 days, and the compliance team wants proof that the secret is actually configured for periodic rotation. Which AWS service can continuously evaluate that requirement by using managed rules?"
  options:
    - "AWS Config"
    - "Amazon GuardDuty"
    - "Amazon Redshift"
    - "Amazon Neptune"
  correct: [A]
  why: "AWS Config can evaluate resource compliance by using managed or custom rules, including checks related to Secrets Manager rotation settings. GuardDuty is for threat detection, not configuration compliance evaluation. The key boundary is continuous compliance assessment against a security rule. Key rule: For compliance evaluation of configuration rules such as secret rotation, use AWS Config."
  ref: "Q068 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/secretsmanager/latest/userguide/find-secrets-not-rotating.html"
  exams: [saa-open]

- id: open-saa-q069
  kind: choice
  en: "An operations team needs browser-based access to EC2 instances for troubleshooting. The security team does not want inbound SSH open to the internet or SSH key distribution. Which AWS feature is the best fit?"
  options:
    - "AWS Systems Manager Session Manager"
    - "Amazon Macie"
    - "Amazon Inspector"
    - "AWS Client VPN only"
  correct: [A]
  why: "Systems Manager Session Manager provides shell access to managed instances without opening inbound SSH ports or distributing SSH keys. Client VPN solves network access for users, not instance-session management by itself. Inspector and Macie are unrelated. The answer boundary is administrative session access without SSH exposure. Key rule: No inbound SSH and no key distribution for EC2 administration points to Session Manager."
  ref: "Q069 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"
  exams: [saa-open]

- id: open-saa-q070
  kind: choice
  en: "A public web application is receiving SQL injection probes and cross-site scripting attempts. The team wants a managed service that can filter these HTTP-layer attacks before they reach the application. Which service should they use?"
  options:
    - "Amazon Route 53 Resolver"
    - "Amazon GuardDuty"
    - "AWS Shield Advanced only"
    - "AWS WAF"
  correct: [D]
  why: "AWS WAF is designed for Layer 7 filtering of web requests and includes protections for attacks such as SQL injection and cross-site scripting. Shield Advanced focuses on broader DDoS protection, not fine-grained web request inspection rules. GuardDuty detects threats but does not sit inline to filter web traffic. The boundary is HTTP request filtering. Key rule: SQLi and XSS filtering at the web layer points to AWS WAF."
  ref: "Q070 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html"
  exams: [saa-open]

- id: open-saa-q071
  kind: choice
  en: "A company wants additional protection and expert support for large-scale DDoS attacks against its internet-facing applications running behind CloudFront and Application Load Balancers. Which AWS service tier is the best fit?"
  options:
    - "AWS Secrets Manager"
    - "Amazon Inspector"
    - "AWS Shield Advanced"
    - "AWS Shield Standard"
  correct: [C]
  why: "AWS Shield Advanced adds additional DDoS protections, visibility, and access to the AWS DDoS Response Team beyond the baseline protections of Shield Standard. Inspector and Secrets Manager solve vulnerability and secret-management problems instead. The key boundary is advanced managed DDoS protection with expert response support. Key rule: For enhanced DDoS protection and response support, choose AWS Shield Advanced."
  ref: "Q071 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-advanced-summary.html"
  exams: [saa-open]

- id: open-saa-q072
  kind: choice
  en: "A security operations center wants one managed service to aggregate and normalize security findings from multiple AWS security services and partner products in a central place. Which service is the best fit?"
  options:
    - "Amazon ElastiCache"
    - "AWS Security Hub"
    - "Amazon Aurora"
    - "AWS Config"
  correct: [B]
  why: "AWS Security Hub aggregates and normalizes security findings from integrated AWS and partner services so teams can work from a central findings view. AWS Config provides configuration state and compliance tracking, which is different from a findings hub. The deciding boundary is multi-source security finding aggregation. Key rule: If you need a central findings hub across AWS security tools, use AWS Security Hub."
  ref: "Q072 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html"
  exams: [saa-open]

- id: open-saa-q073
  kind: choice
  en: "A cloud security team wants managed threat detection that analyzes AWS logs and telemetry to identify suspicious behaviors such as credential misuse, unusual API activity, and potential compromise. Which service should it enable?"
  options:
    - "Amazon Neptune"
    - "AWS IAM Identity Center"
    - "AWS Backup"
    - "Amazon GuardDuty"
  correct: [D]
  why: "Amazon GuardDuty is the threat-detection service that analyzes AWS signal sources and generates findings about suspicious activity. IAM Identity Center manages workforce access, Neptune is a graph database, and Backup handles recovery policies. The key boundary is managed threat detection, not identity provisioning or storage protection. Key rule: Managed AWS threat detection for suspicious activity points to GuardDuty."
  ref: "Q073 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html"
  exams: [saa-open]

- id: open-saa-q074
  kind: choice
  en: "A platform team wants a managed service that continuously scans Amazon EC2 instances and container images in Amazon ECR for software vulnerabilities. Which service is the best fit?"
  options:
    - "AWS Organizations"
    - "AWS Client VPN"
    - "Amazon Inspector"
    - "Amazon Macie"
  correct: [C]
  why: "Amazon Inspector is the managed vulnerability management service for workloads such as EC2 instances and container images in ECR. Macie classifies S3 data, Organizations manages accounts, and Client VPN provides remote access. The deciding boundary is vulnerability scanning for compute assets and images. Key rule: Vulnerability scanning for EC2 and ECR points to Amazon Inspector."
  ref: "Q074 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/inspector/latest/user/scanning-resources.html"
  exams: [saa-open]

- id: open-saa-q075
  kind: choice
  en: "A company wants an authoritative record of who called AWS APIs, when the calls happened, and from which source. Which service should it rely on?"
  options:
    - "AWS Snowball Edge"
    - "AWS CloudTrail"
    - "AWS WAF"
    - "Amazon ElastiCache"
  correct: [B]
  why: "AWS CloudTrail records API activity for governance, auditing, and operational investigation. WAF filters web traffic, ElastiCache is a cache, and Snowball is a transfer appliance. The key boundary is auditable API event history across AWS activity. Key rule: Use CloudTrail when the requirement is auditing AWS API activity and account-level event history."
  ref: "Q075 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"
  exams: [saa-open]

- id: open-saa-q076
  kind: choice
  en: "An application stores files in Amazon S3 and the compliance team requires the encryption key to be customer controlled, with audit visibility into key usage. Which S3 encryption choice is the best fit?"
  options:
    - "SSE-S3"
    - "SSE-KMS with a customer managed KMS key"
    - "Client-side compression"
    - "S3 Transfer Acceleration"
  correct: [B]
  why: "SSE-KMS with a customer managed KMS key gives the customer control over the key policy and visibility into key usage through AWS services such as CloudTrail. SSE-S3 is still server-side encryption, but it does not give the same KMS key management and auditing model. The boundary is customer-controlled key governance for S3 encryption. Key rule: Customer-controlled audit-capable key management for S3 encryption points to SSE-KMS with a customer managed key."
  ref: "Q076 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html ; https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html"
  exams: [saa-open]

- id: open-saa-q077
  kind: choice
  en: "A company with many AWS accounts wants its workforce to sign in through a central access portal and use assigned permission sets instead of maintaining separate IAM users in each account. Which AWS service is the best fit?"
  options:
    - "AWS Organizations SCPs"
    - "AWS IAM Identity Center"
    - "Amazon Redshift"
    - "Amazon GuardDuty"
  correct: [B]
  why: "IAM Identity Center is the workforce access service for centralized sign-in and account/application access using permission sets. SCPs are organization guardrails, not a workforce sign-in portal or assignment model. GuardDuty and Redshift solve unrelated problems. The deciding boundary is centralized workforce access management across accounts. Key rule: Central workforce sign-in and account assignments across AWS accounts point to IAM Identity Center."
  ref: "Q077 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html"
  exams: [saa-open]

- id: open-saa-q078
  kind: choice
  en: "A customer-facing web and mobile application needs user sign-up, sign-in, and token-based authentication managed by AWS instead of building a custom identity system from scratch. Which service is the best fit?"
  options:
    - "AWS Organizations"
    - "AWS IAM Identity Center"
    - "Amazon Cognito"
    - "Amazon Inspector"
  correct: [C]
  why: "Amazon Cognito is the AWS service for customer identity, authentication flows, and token issuance for applications. IAM Identity Center is geared toward workforce access rather than end-user app identity. Organizations and Inspector are unrelated. The key boundary is customer application authentication, not employee access. Key rule: End-user sign-up and sign-in for applications point to Amazon Cognito."
  ref: "Q078 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools.html"
  exams: [saa-open]

- id: open-saa-q079
  kind: choice
  en: "A root account is currently protected only by a strong password. Which additional control is most important to reduce the risk of account takeover?"
  options:
    - "Deploy Amazon Neptune"
    - "Add an internet gateway to the management VPC"
    - "Create more IAM users"
    - "Enable multi-factor authentication for the root user"
  correct: [D]
  why: "Enabling MFA for the root user is a foundational security best practice because the root account has unrestricted authority. Creating more IAM users or unrelated infrastructure changes does not materially address root-account takeover risk. The key boundary is protecting the most privileged identity. Key rule: Protect the AWS account root user with MFA and avoid using it for routine administrative tasks."
  ref: "Q079 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/IAM/latest/UserGuide/enable-mfa-for-root.html"
  exams: [saa-open]

- id: open-saa-q080
  kind: choice
  en: "An API service needs one web-facing control plane action that can decrypt stored values with AWS KMS but must not be allowed to administer keys, rotate key policies, or schedule deletion. What is the right IAM approach?"
  options:
    - "Use an SCP to deny every KMS action in the account"
    - "Grant only the specific KMS usage permissions the service needs"
    - "Share the root account credentials with the service"
    - "Grant the service kms:* on all keys"
  correct: [B]
  why: "Following least privilege means granting only the specific KMS actions required, such as decrypt or generate data key operations, rather than broad administrative permissions. An SCP that denies all KMS actions would break the use case entirely, and root credential sharing is unacceptable. The boundary is operational use of a key without key administration. Key rule: KMS consumers should receive only the key-usage actions they need, not administrative wildcards."
  ref: "Q080 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/kms/latest/developerguide/key-policies.html ; https://docs.aws.amazon.com/kms/latest/developerguide/least-privilege.html"
  exams: [saa-open]

- id: open-saa-q081
  kind: choice
  en: "A security engineer wants to know whenever an S3 bucket becomes public because of a configuration change. The team needs continuous evaluation of resource configuration state against a rule. Which service is the best fit?"
  options:
    - "AWS Config"
    - "AWS Shield Advanced"
    - "Amazon ElastiCache"
    - "Amazon GuardDuty"
  correct: [A]
  why: "AWS Config is the service for tracking resource configuration state and evaluating it against rules over time. GuardDuty can produce security findings, including findings related to risky S3 exposure, but it is not the configuration-compliance rule engine requested in the scenario. Shield Advanced and ElastiCache are unrelated to S3 public-access compliance tracking. The boundary is continuous resource configuration evaluation against a rule. Key rule: Continuous evaluation of resource configuration against compliance rules means AWS Config."
  ref: "Q081 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config.html"
  exams: [saa-open]

- id: open-saa-q082
  kind: choice
  en: "A company uses AWS Organizations and wants to stop member accounts from launching expensive GPU instance families, even if local admins attempt to grant that permission with IAM policies. Which control should be used?"
  options:
    - "An S3 lifecycle rule"
    - "A service control policy"
    - "A presigned URL"
    - "A route table"
  correct: [B]
  why: "An SCP sets the maximum permissions that can be used in member accounts, so it is the correct preventive control when local admins must not be able to override the restriction. The other options are unrelated. The key boundary is an organization-level deny that overrides local IAM attempts to allow an action. Key rule: Organization-wide preventive limits on allowed actions belong in SCPs."
  ref: "Q082 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"
  exams: [saa-open]

- id: open-saa-q083
  kind: choice
  en: "A company must store API tokens that applications retrieve at runtime. The security architect wants automatic encryption, controlled retrieval permissions, and optional managed rotation. Which AWS service is the best fit?"
  options:
    - "AWS Snowball Edge"
    - "Amazon S3 Batch Operations"
    - "Amazon Athena"
    - "AWS Secrets Manager"
  correct: [D]
  why: "Secrets Manager is designed for storing and retrieving secrets with IAM-controlled access and optional rotation support. The other services solve analytics, bulk object operations, and data transfer. The deciding boundary is secret storage and lifecycle management for runtime credentials. Key rule: Runtime secret storage with optional rotation points to AWS Secrets Manager."
  ref: "Q083 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"
  exams: [saa-open]

- id: open-saa-q084
  kind: choice
  en: "A cloud team wants a managed service that can show a consolidated view of which security controls and findings are failing across accounts and Regions, rather than checking each AWS security service separately. Which service is the best fit?"
  options:
    - "Amazon Neptune"
    - "AWS DataSync"
    - "AWS Security Hub"
    - "AWS KMS"
  correct: [C]
  why: "AWS Security Hub centralizes and normalizes findings and security posture information from multiple integrated services. AWS KMS is for key management, Neptune is a graph database, and DataSync is a transfer service. The boundary is centralized security posture and findings management. Key rule: Centralized cross-service security findings and posture belong in Security Hub."
  ref: "Q084 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html"
  exams: [saa-open]

- id: open-saa-q085
  kind: choice
  en: "A company wants a detective control that highlights EC2 instances potentially communicating with known malicious IP addresses and domains. Which AWS service is the best fit?"
  options:
    - "Amazon GuardDuty"
    - "Amazon Redshift"
    - "AWS Organizations"
    - "AWS WAF"
  correct: [A]
  why: "Amazon GuardDuty analyzes AWS telemetry and threat intelligence to generate findings about potentially compromised resources and suspicious communications. WAF is an inline web filter, Organizations manages accounts, and Redshift is a warehouse. The key boundary is managed threat detection for suspicious resource behavior. Key rule: Threat findings about suspicious EC2 communication patterns point to GuardDuty."
  ref: "Q085 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html"
  exams: [saa-open]

- id: open-saa-q086
  kind: choice
  en: "A team is packaging a stateless API into containers and wants AWS to run the service without managing EC2 worker nodes or patching cluster hosts. Which compute option is the best fit?"
  options:
    - "Amazon ECS on AWS Fargate"
    - "Amazon ECS on self-managed EC2 only"
    - "Amazon Neptune"
    - "Amazon Redshift"
  correct: [A]
  why: "Amazon ECS on AWS Fargate lets the team run containers without managing server fleets. ECS on EC2 requires instance management for the cluster capacity, which is exactly what the team wants to avoid. Neptune and Redshift are unrelated data services. The boundary is managed container execution without host management. Key rule: If you want containers without managing servers, use Fargate."
  ref: "Q086 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html"
  exams: [saa-open]

- id: open-saa-q087
  kind: choice
  en: "A platform team wants to run long-lived containerized services with fine-grained control over underlying EC2 instance types, daemon agents, and host-level tuning. Which ECS capacity model best fits?"
  options:
    - "AWS App Runner"
    - "Amazon Cognito"
    - "AWS Lambda"
    - "Amazon ECS on EC2"
  correct: [D]
  why: "Amazon ECS on EC2 is the right model when the team wants control over the underlying instance fleet and host configuration. Fargate and App Runner abstract away that layer, which is not what the team wants here. Lambda is event-driven function compute rather than host-managed container services. The key boundary is host-level control. Key rule: If you need host-level control for containers, choose ECS on EC2 rather than Fargate."
  ref: "Q087 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/launch_types.html"
  exams: [saa-open]

- id: open-saa-q088
  kind: choice
  en: "A small team has source code for a web API and wants the fastest path to deploy it as a managed web service directly from source or container image, with minimal infrastructure decisions. Which AWS service is the best fit?"
  options:
    - "Amazon ECS on EC2"
    - "AWS App Runner"
    - "Amazon Neptune"
    - "Amazon RDS Proxy"
  correct: [B]
  why: "AWS App Runner is purpose-built for quickly deploying web apps and APIs directly from source code or container images with very little infrastructure management. ECS on EC2 requires more operational choices around clusters and capacity. Neptune and RDS Proxy solve unrelated problems. The deciding boundary is simplest managed web-service deployment path. Key rule: For the simplest managed deployment of a web app or API from code or image, use App Runner."
  ref: "Q088 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/apprunner/latest/dg/service-source-code.html"
  exams: [saa-open]

- id: open-saa-q089
  kind: choice
  en: "A company has an event-driven image resize task that runs for a few seconds per request and should incur no charge when idle. The code does not need custom container orchestration. Which compute service is the best fit?"
  options:
    - "AWS Lambda"
    - "AWS Direct Connect"
    - "Amazon ECS on EC2"
    - "Amazon EC2 Auto Scaling group"
  correct: [A]
  why: "AWS Lambda is the natural fit for short-lived event-driven functions that should scale automatically and incur no execution cost when idle. ECS on EC2 and Auto Scaling groups involve always-on infrastructure decisions that are unnecessary for this use case. Direct Connect is networking, not compute. The boundary is short-lived event-driven code with idle-free operations. Key rule: Short event-driven code with no idle server management points to Lambda."
  ref: "Q089 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-concepts.html"
  exams: [saa-open]

- id: open-saa-q090
  kind: choice
  en: "A latency-sensitive checkout API uses AWS Lambda and occasionally suffers from cold-start outliers during bursts. The team wants pre-initialized environments ready to serve requests immediately. Which Lambda feature should it configure?"
  options:
    - "Dead-letter queues"
    - "Provisioned concurrency"
    - "S3 Transfer Acceleration"
    - "Reserved concurrency only"
  correct: [B]
  why: "Provisioned concurrency keeps Lambda execution environments initialized and ready for low-latency responses, which directly addresses cold-start sensitivity for interactive workloads. Reserved concurrency caps and reserves concurrency but does not pre-initialize environments. The key boundary is pre-initialized execution capacity for latency-sensitive traffic. Key rule: If Lambda needs pre-initialized environments for low latency, use provisioned concurrency."
  ref: "Q090 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html ; https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html"
  exams: [saa-open]

- id: open-saa-q091
  kind: choice
  en: "A Java-based AWS Lambda function has heavy initialization code and the team wants to reduce startup latency on published versions without keeping execution environments permanently pre-warmed. Which feature is the best fit?"
  options:
    - "AWS Batch"
    - "Lambda SnapStart"
    - "Lambda destinations"
    - "RDS Proxy"
  correct: [B]
  why: "Lambda SnapStart reduces startup latency by snapshotting the initialized execution environment for published versions, which is especially useful for runtimes with expensive initialization. RDS Proxy addresses database connections, while Batch is for batch computing. The deciding boundary is initialization-latency reduction for published Lambda versions. Key rule: Heavy Lambda initialization on supported runtimes points to SnapStart."
  ref: "Q091 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html ; https://docs.aws.amazon.com/lambda/latest/dg/snapstart-activate.html"
  exams: [saa-open]

- id: open-saa-q092
  kind: choice
  en: "A workflow coordinates several AWS Lambda functions, includes branching logic, retries, and waits between steps, and the team wants the orchestration state managed by AWS. Which service is the best fit?"
  options:
    - "Amazon SQS only"
    - "Amazon EBS Multi-Attach"
    - "AWS Step Functions"
    - "Amazon FSx for Lustre"
  correct: [C]
  why: "AWS Step Functions is the orchestration service for stateful workflows with branching, retries, waits, and service integrations. SQS is messaging, but it does not provide the same visual state-machine execution model. The other services are storage products. The key boundary is managed workflow orchestration with state. Key rule: Stateful orchestration across steps points to Step Functions."
  ref: "Q092 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-workflows.html"
  exams: [saa-open]

- id: open-saa-q093
  kind: choice
  en: "A genomics research group submits large queues of containerized simulation jobs that can run for hours. They want a managed service built for queueing, scheduling, and scaling batch compute resources. Which service is the best fit?"
  options:
    - "AWS Batch"
    - "Amazon ECS service with a fixed desired task count"
    - "Amazon SQS with an Auto Scaling group of self-managed EC2 workers"
    - "Amazon EventBridge Scheduler launching individual container tasks"
  correct: [A]
  why: "AWS Batch is the managed batch-computing service for queued compute-intensive jobs and can provision the right underlying compute resources automatically. An ECS service with fixed desired count is better for continuously running services than queued batch jobs, EventBridge Scheduler is time-based scheduling rather than batch queue management, and SQS with self-managed EC2 workers adds custom fleet operations. The boundary is managed scheduled batch computing rather than request-driven service hosting or custom worker fleets. Key rule: Queued compute-intensive batch workloads point to AWS Batch."
  ref: "Q093 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/batch/latest/userguide/job_queues.html"
  exams: [saa-open]

- id: open-saa-q094
  kind: choice
  en: "A web application can tolerate interruptions because its instances are stateless and backed by an Auto Scaling group. The team wants to lower EC2 cost aggressively. Which purchasing option is the best fit for the interruptible portion of the fleet?"
  options:
    - "On-Demand Capacity Reservations"
    - "Dedicated Hosts"
    - "A 1-year partial upfront RI only"
    - "Spot Instances"
  correct: [D]
  why: "Spot Instances are ideal for fault-tolerant, interruptible workloads that can handle capacity reclamation. Dedicated Hosts and Capacity Reservations are about isolation or guaranteed capacity rather than lowest-cost interruptible execution. The key boundary is tolerance for interruption in exchange for lower price. Key rule: Interruptible and fault-tolerant EC2 capacity points to Spot."
  ref: "Q094 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html ; https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-best-practices.html"
  exams: [saa-open]

- id: open-saa-q095
  kind: choice
  en: "A company runs a steady baseline of Amazon EC2, AWS Fargate, and AWS Lambda usage, and it wants one savings commitment model that can apply across all three. Which purchasing option is the best fit?"
  options:
    - "Spot Instances"
    - "Standard Reserved Instances for one EC2 family"
    - "Dedicated Hosts"
    - "Compute Savings Plans"
  correct: [D]
  why: "Compute Savings Plans are the flexible commitment model that can apply across eligible EC2, Fargate, and Lambda usage. Standard EC2 reservations are narrower and do not cover all three service types. Spot and Dedicated Hosts are different purchasing models with different goals. The deciding boundary is cross-service compute savings flexibility. Key rule: If the savings commitment must span EC2, Fargate, and Lambda, choose Compute Savings Plans."
  ref: "Q095 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html ; https://docs.aws.amazon.com/cost-management/latest/userguide/manage-sp.html"
  exams: [saa-open]

- id: open-saa-q096
  kind: choice
  en: "A team runs variable EC2 web traffic and wants one Auto Scaling group that can combine On-Demand and Spot capacity with multiple instance types for better availability and cost optimization. Which design is the best fit?"
  options:
    - "A DynamoDB global table"
    - "One fixed single-instance-type On-Demand group only"
    - "A mixed instances Auto Scaling group"
    - "An S3 lifecycle rule"
  correct: [C]
  why: "A mixed instances Auto Scaling group is specifically designed to combine multiple instance types and purchase options such as On-Demand and Spot in one scaling group. The other options do not address fleet-level compute capacity diversification. The key boundary is cost-aware resilient scaling across instance types and purchase models. Key rule: If one ASG should mix Spot and On-Demand across instance types, use a mixed instances policy."
  ref: "Q096 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-mixed-instances-groups.html"
  exams: [saa-open]

- id: open-saa-q097
  kind: choice
  en: "A development team wants the simplest path to deploy a conventional web application written in a supported language while still letting AWS provision instances, load balancing, health checks, and scaling. Which service is the best fit?"
  options:
    - "AWS Elastic Beanstalk"
    - "Amazon Neptune"
    - "AWS Snowball Edge"
    - "Amazon ECS on EC2 only"
  correct: [A]
  why: "Elastic Beanstalk is the managed application platform for supported web application stacks and abstracts much of the infrastructure provisioning and scaling work. ECS on EC2 is more container-centric and operationally involved. Neptune and Snowball solve unrelated problems. The deciding boundary is rapid deployment of a traditional web app with managed infrastructure automation. Key rule: Supported web apps with minimal platform management point to Elastic Beanstalk."
  ref: "Q097 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/concepts.html"
  exams: [saa-open]

- id: open-saa-q098
  kind: choice
  en: "A microservice runs in containers and the team wants to expose it publicly with a managed load balancer while each task has its own elastic network interface and isolation boundary. Which container launch model best fits?"
  options:
    - "Amazon ECS with AWS Fargate"
    - "AWS Lambda function URLs only"
    - "Amazon DocumentDB"
    - "Amazon EC2 Spot Fleet without containers"
  correct: [A]
  why: "AWS Fargate tasks in ECS provide task-level isolation and own ENIs, making them a strong fit for managed containerized microservices behind a load balancer. Spot Fleet without containers is not the same application model, and Lambda function URLs do not solve the same container-service requirement. The key boundary is managed container service isolation. Key rule: Managed isolated ECS tasks without server management point to Fargate."
  ref: "Q098 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html"
  exams: [saa-open]

- id: open-saa-q099
  kind: choice
  en: "A Lambda function processes messages from Amazon SQS. Some messages in a batch may fail while others succeed, and the team wants to avoid retrying messages that already completed successfully. What design principle is most important here?"
  options:
    - "Implement partial batch response handling"
    - "Move the queue to Amazon S3"
    - "Enable S3 Transfer Acceleration"
    - "Use Amazon Neptune for retries"
  correct: [A]
  why: "When Lambda processes SQS batches, partial batch response handling lets the function report only failed records so successfully processed messages are not retried unnecessarily. The other options are unrelated. The key boundary is correct per-record retry behavior inside batched queue processing. Key rule: Lambda with SQS should use partial batch response logic when some records can succeed and others fail."
  ref: "Q099 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html"
  exams: [saa-open]

- id: open-saa-q100
  kind: choice
  en: "An internal service runs continuously all year on a fixed EC2 instance family in one Region, and the team does not expect to change that footprint. Which pricing model generally provides the deepest discount among flexible long-term options for that narrow EC2 commitment?"
  options:
    - "AWS Direct Connect"
    - "Spot Instances for the entire mandatory baseline"
    - "On-Demand only"
    - "EC2 Instance Savings Plans"
  correct: [D]
  why: "EC2 Instance Savings Plans are optimized for savings within a chosen EC2 instance family in a Region and are less flexible than Compute Savings Plans, which is part of why they can provide deeper savings for that narrower commitment. Spot is not appropriate for a mandatory always-on baseline. The answer boundary is fixed EC2 family commitment rather than broad compute portability. Key rule: If the workload is fixed to one EC2 family and Region, EC2 Instance Savings Plans are the narrower high-savings fit."
  ref: "Q100 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html ; https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-ris.html"
  exams: [saa-open]

- id: open-saa-q101
  kind: choice
  en: "A data-processing platform needs containers with GPU access and custom AMIs. The team also wants to keep using the Amazon ECS control plane. Which compute option is the best fit?"
  options:
    - "AWS Fargate"
    - "Amazon ECS on EC2"
    - "AWS Lambda"
    - "AWS App Runner"
  correct: [B]
  why: "ECS on EC2 is the right fit when workloads need host-level capabilities such as custom AMIs or specialized instance types including GPU-backed instances. Fargate deliberately abstracts away host management and is not the answer for every host-specific requirement. App Runner and Lambda are even higher-level abstractions. The key boundary is host-specific container requirements. Key rule: If the container workload needs custom AMIs or GPUs, prefer ECS on EC2 over Fargate."
  ref: "Q101 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html"
  exams: [saa-open]

- id: open-saa-q102
  kind: choice
  en: "A workflow has to coordinate manual approvals, long-running waits, and multiple service calls, and the team needs an auditable execution history. Which Step Functions workflow type characteristic is the best fit?"
  options:
    - "Standard workflow for long-running auditable orchestration"
    - "Use only EventBridge schedule rules"
    - "A NAT gateway with health checks"
    - "An EBS volume for workflow history"
  correct: [A]
  why: "Step Functions Standard workflows are intended for long-running, auditable orchestrations with execution history and visual debugging. EventBridge schedules can trigger jobs, but they do not replace stateful workflow execution. The other options are unrelated. The boundary is long-running orchestrated process control with auditability. Key rule: Long-running, auditable orchestration points to Step Functions Standard workflows."
  ref: "Q102 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html"
  exams: [saa-open]

- id: open-saa-q103
  kind: choice
  en: "A team needs to deploy a containerized API from an existing container image and wants automatic build/deploy integration and fully managed operations, but does not need Kubernetes-level control. Which service is the best fit?"
  options:
    - "Amazon Neptune"
    - "Amazon EKS on EC2"
    - "AWS App Runner"
    - "Amazon FSx for Lustre"
  correct: [C]
  why: "App Runner is specifically intended to deploy and run containerized web applications and APIs directly from source code or container images with minimal operational burden. EKS gives far more control and complexity than the scenario needs. The other services are unrelated. The answer boundary is fully managed containerized web service deployment. Key rule: Containerized web apps from code or image with minimal ops point to App Runner."
  ref: "Q103 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/apprunner/latest/dg/service-source-image.html"
  exams: [saa-open]

- id: open-saa-q104
  kind: choice
  en: "A company wants to run asynchronous worker code from an Amazon SQS queue in a Beanstalk-managed environment instead of exposing a public web tier. Which Elastic Beanstalk environment type best fits?"
  options:
    - "Web server environment only"
    - "Worker environment"
    - "Transit Gateway attachment"
    - "Single EBS volume"
  correct: [B]
  why: "Elastic Beanstalk worker environments are specifically designed to process messages from an Amazon SQS queue. A web server environment is for HTTP-facing application tiers. The other options are unrelated infrastructure constructs. The key boundary is queue-driven background processing in Beanstalk. Key rule: Queue-driven background work in Beanstalk points to a worker environment."
  ref: "Q104 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features-managing-env-tiers.html"
  exams: [saa-open]

- id: open-saa-q105
  kind: choice
  en: "A company needs the absolute simplest way to run a small request-driven function with no container packaging and no server fleet to manage. Which service is the best fit?"
  options:
    - "AWS Step Functions Standard workflow"
    - "AWS App Runner service"
    - "AWS Lambda"
    - "Amazon ECS task on AWS Fargate behind an Application Load Balancer"
  correct: [C]
  why: "Lambda is the simplest request-driven compute service for code functions when the team does not want to package and operate containers or servers. App Runner and ECS on Fargate are better fits for containerized web services, and Step Functions orchestrates workflows rather than running a single code function by itself. The key boundary is minimal operational overhead for direct function execution. Key rule: If you just need serverless code execution, choose Lambda."
  ref: "Q105 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-concepts.html"
  exams: [saa-open]

- id: open-saa-q106
  kind: choice
  en: "A mixed EC2 fleet has a fixed 24/7 baseline that cannot be interrupted and an elastic overflow tier that is fault tolerant. Which purchasing model combination is the most appropriate?"
  options:
    - "Savings Plans or reserved-style commitment for the baseline plus Spot for the elastic tier"
    - "On-Demand only for every instance"
    - "Dedicated Hosts for the overflow tier only"
    - "Spot for both baseline and overflow"
  correct: [A]
  why: "A steady mandatory baseline is a good candidate for committed pricing such as Savings Plans or reserved-style savings, while the interruptible overflow tier is a good candidate for Spot. Using Spot for the mandatory baseline creates availability risk, and On-Demand only misses a clear cost-optimization opportunity. The key boundary is separating noninterruptible baseline from flexible burst capacity. Key rule: Use committed pricing for the baseline and Spot for fault-tolerant overflow."
  ref: "Q106 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html ; https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-ris.html"
  exams: [saa-open]

- id: open-saa-q107
  kind: choice
  en: "A team wants a container platform with full Kubernetes APIs and ecosystem compatibility, but it does not want to self-manage the Kubernetes control plane. Which AWS service is the best fit?"
  options:
    - "Amazon EKS"
    - "AWS App Runner"
    - "Amazon ECS"
    - "AWS Lambda"
  correct: [A]
  why: "Amazon EKS provides managed Kubernetes control plane capability for teams that need Kubernetes APIs and compatibility. ECS and App Runner are container services but are not Kubernetes control planes. Lambda is event-driven function compute. The deciding boundary is managed Kubernetes, not just managed containers. Key rule: If the requirement is Kubernetes compatibility, choose Amazon EKS."
  ref: "Q107 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-concepts.html"
  exams: [saa-open]

- id: open-saa-q108
  kind: choice
  en: "An EKS platform team wants to run selected pods without managing node groups, while still using Kubernetes scheduling semantics in the cluster. Which option is the best fit?"
  options:
    - "Run those pods on AWS Fargate for Amazon EKS"
    - "Use an EKS managed node group with Cluster Autoscaler"
    - "Run the workload as standalone AWS Batch jobs outside the cluster"
    - "Use Karpenter to provision EC2 nodes for those pods"
  correct: [A]
  why: "AWS Fargate for Amazon EKS lets selected pods run without self-managed nodes while remaining part of the EKS cluster model. Karpenter and managed node groups can automate or simplify EC2 node capacity, but the pods still run on nodes. AWS Batch moves the workload outside normal Kubernetes pod scheduling. The key boundary is node-less pod execution inside EKS. Key rule: Selected Kubernetes pods without node management point to Fargate for EKS."
  ref: "Q108 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html"
  exams: [saa-open]

- id: open-saa-q109
  kind: choice
  en: "A product team wants to publish a simple HTTPS endpoint backed by Lambda but does not need the full feature set of Amazon API Gateway for this specific use case. Which feature could satisfy that direct invocation pattern?"
  options:
    - "Amazon FSx for ONTAP"
    - "Lambda function URL"
    - "AWS Snowball Edge"
    - "An EBS snapshot"
  correct: [B]
  why: "A Lambda function URL provides a direct HTTPS endpoint to invoke a Lambda function and is suitable when the use case does not require the broader feature set of API Gateway. The other options are unrelated storage and transfer features. The key boundary is a simple direct HTTPS endpoint for a Lambda function. Key rule: For a simple direct HTTPS endpoint to a Lambda function, a function URL can fit."
  ref: "Q109 (Serverless) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/lambda/latest/dg/lambda-urls.html"
  exams: [saa-open]

- id: open-saa-q110
  kind: choice
  en: "A company needs to expose an HTTP service running on multiple ECS tasks and wants traffic sent only to healthy tasks based on application-level health probes. Which component should it use?"
  options:
    - "An S3 lifecycle rule"
    - "Application Load Balancer target group health checks"
    - "A KMS key policy"
    - "A DynamoDB global table"
  correct: [B]
  why: "An Application Load Balancer uses target groups and health checks to route requests only to healthy registered targets. The other options do not provide HTTP traffic distribution or application health awareness. The boundary is application-level request routing to healthy service tasks. Key rule: HTTP routing only to healthy service targets points to an ALB target group with health checks."
  ref: "Q110 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"
  exams: [saa-open]

- id: open-saa-q111
  kind: choice
  en: "An order platform publishes one event when a purchase completes. The billing, loyalty, and fraud services must all receive the event, but each service only cares about a subset of order types. Which design is the best fit?"
  options:
    - "One NAT gateway per consumer"
    - "Amazon SNS topic with subscription filter policies"
    - "Single Amazon SQS queue shared by all consumers"
    - "Amazon EBS Multi-Attach"
  correct: [B]
  why: "Amazon SNS provides fan-out to multiple subscribers, and subscription filter policies let each downstream consumer receive only the events it needs. A single shared SQS queue would distribute messages among consumers instead of sending each message to all of them. The key boundary is one-to-many delivery with per-subscriber filtering. Key rule: One event to many consumers with per-subscriber filtering points to SNS with filter policies."
  ref: "Q111 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html ; https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html"
  exams: [saa-open]

- id: open-saa-q112
  kind: choice
  en: "A payment workflow must preserve the exact order of updates for each transaction and must avoid introducing duplicate queue entries when producers retry sends. Which Amazon SQS queue type is the best fit?"
  options:
    - "Dead-letter queue"
    - "FIFO queue"
    - "Standard queue"
    - "Delay queue only"
  correct: [B]
  why: "An SQS FIFO queue is designed for ordered processing with deduplication capabilities, which fits transaction-by-transaction ordering requirements. Standard queues prioritize scale and best-effort ordering instead. A dead-letter queue is a failure-handling pattern, not the primary queue type for ordered processing. The boundary is ordered, deduplicated messaging. Key rule: If message order and deduplication matter, choose SQS FIFO."
  ref: "Q112 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues-exactly-once-processing.html ; https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html"
  exams: [saa-open]

- id: open-saa-q113
  kind: choice
  en: "A worker occasionally needs several minutes to process a message from Amazon SQS. The same message sometimes becomes visible again before processing finishes, causing another worker to start it. Which queue setting should be adjusted first?"
  options:
    - "Long polling wait time"
    - "Delay seconds"
    - "Visibility timeout"
    - "Message retention period"
  correct: [C]
  why: "The visibility timeout controls how long a received message stays hidden from other consumers while it is being processed. If it is too short, another worker can receive the same message before the first one finishes. Retention, delay, and long polling settings solve different queue behaviors. The boundary is duplicate concurrent processing due to early re-visibility. Key rule: If SQS messages reappear before processing completes, increase visibility timeout."
  ref: "Q113 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"
  exams: [saa-open]

- id: open-saa-q114
  kind: choice
  en: "A queue-based processing system has occasional poison messages that repeatedly fail and block clean throughput. The team wants those bad messages isolated automatically after repeated receive attempts. Which SQS feature should be configured?"
  options:
    - "SNS filter policy"
    - "Dead-letter queue"
    - "Message timer"
    - "Long polling"
  correct: [B]
  why: "A dead-letter queue captures messages that repeatedly fail processing so the main queue can continue moving healthy work. Long polling reduces empty receives but does not isolate poison messages. Message timers delay delivery rather than separating failures. The key boundary is isolating repeatedly failing messages. Key rule: To isolate repeatedly failing SQS messages, use a dead-letter queue."
  ref: "Q114 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html"
  exams: [saa-open]

- id: open-saa-q115
  kind: choice
  en: "A fleet of pollers checks an Amazon SQS queue and often receives empty responses, driving up API call volume and cost. Which SQS feature should the team enable?"
  options:
    - "An SCP"
    - "Long polling"
    - "A Route 53 health check"
    - "A FIFO queue"
  correct: [B]
  why: "Long polling lets SQS wait briefly for messages before returning a response, which reduces empty responses and unnecessary polling cost. FIFO changes ordering semantics, not polling efficiency. The other options are unrelated. The key boundary is reducing empty receives from SQS consumers. Key rule: If SQS polling is producing many empty receives, enable long polling."
  ref: "Q115 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html"
  exams: [saa-open]

- id: open-saa-q116
  kind: choice
  en: "A telemetry platform ingests ordered events and must let several independent applications read the same stream at the same time with low latency. Which service is the best fit?"
  options:
    - "AWS Storage Gateway File Gateway"
    - "Amazon SNS topic only"
    - "Amazon Kinesis Data Streams"
    - "Amazon SQS standard queue"
  correct: [C]
  why: "Kinesis Data Streams is designed for ordered streaming data with multiple consumers reading the same shard data. An SQS queue distributes messages to consumers rather than letting all of them independently read the same stream. SNS is pub/sub but not the same replayable ordered stream model. The boundary is shared low-latency stream consumption. Key rule: If multiple consumers must independently read the same ordered stream, choose Kinesis Data Streams."
  ref: "Q116 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html"
  exams: [saa-open]

- id: open-saa-q117
  kind: choice
  en: "A security team wants to route AWS service events to multiple targets by matching event patterns, without building custom polling code or point-to-point integrations. Which AWS service is the best fit?"
  options:
    - "Amazon EBS"
    - "Amazon FSx for Lustre"
    - "Amazon EventBridge"
    - "Amazon SQS FIFO"
  correct: [C]
  why: "EventBridge is the event routing service for matching events against patterns and sending them to one or more targets. SQS is a queue, but it does not provide native event-pattern routing across producers and targets. The storage services are unrelated. The deciding boundary is event-pattern-based routing. Key rule: Pattern-based routing of AWS events to targets points to EventBridge."
  ref: "Q117 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rules.html ; https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html"
  exams: [saa-open]

- id: open-saa-q118
  kind: choice
  en: "Two internal services are tightly coupled through synchronous HTTP calls. The team wants the producer to hand work off quickly while the consumer processes at its own pace, even during consumer slowdowns. Which AWS service is the simplest decoupling fit?"
  options:
    - "Amazon Route 53 latency routing"
    - "AWS WAF"
    - "Amazon SQS"
    - "AWS KMS"
  correct: [C]
  why: "Amazon SQS decouples producers from consumers by buffering work in a queue so the producer does not depend on the consumer’s immediate availability. Route 53, WAF, and KMS do not provide asynchronous workload buffering. The key boundary is simple asynchronous decoupling with backpressure tolerance. Key rule: If one service should hand work off asynchronously and let another process later, use SQS."
  ref: "Q118 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-queue-types.html"
  exams: [saa-open]

- id: open-saa-q119
  kind: choice
  en: "A company runs a primary application endpoint and wants DNS to fail over to a standby endpoint only when the primary becomes unhealthy. Which Route 53 routing policy is the best fit?"
  options:
    - "Multivalue answer routing only"
    - "Simple routing"
    - "Geolocation routing"
    - "Failover routing"
  correct: [D]
  why: "Route 53 failover routing is the policy designed for active-passive behavior with primary and secondary records. Simple routing does not incorporate health-based primary/standby logic. The boundary is explicit active-passive DNS failover. Key rule: Primary/secondary DNS failover in Route 53 means failover routing."
  ref: "Q119 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html ; https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html"
  exams: [saa-open]

- id: open-saa-q120
  kind: choice
  en: "A global SaaS application has healthy endpoints in multiple Regions and wants DNS responses to direct users to the Region with the lowest network latency. Which Route 53 routing policy is the best fit?"
  options:
    - "Failover routing"
    - "Simple routing"
    - "Latency routing"
    - "IP-based routing"
  correct: [C]
  why: "Route 53 latency routing is designed to send users to the AWS Region that provides the lowest measured latency. Failover routing is for primary/secondary recovery, not active latency optimization. The key boundary is latency-based global distribution. Key rule: If global users should go to the lowest-latency Region, use Route 53 latency routing."
  ref: "Q120 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-latency.html ; https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html"
  exams: [saa-open]

- id: open-saa-q121
  kind: choice
  en: "A gaming platform needs fixed anycast IP addresses for client allowlists and wants fast traffic redirection to the nearest healthy regional endpoint during outages. Which AWS service is the best fit?"
  options:
    - "AWS Global Accelerator"
    - "AWS Secrets Manager"
    - "Amazon Route 53 failover routing only"
    - "Amazon SQS"
  correct: [A]
  why: "AWS Global Accelerator provides static anycast IP addresses and routes traffic over the AWS global network to healthy endpoints, making it a strong fit for low-latency failover with fixed client-facing IPs. Route 53 is DNS-based and does not provide the same static anycast IP model. The boundary is fixed global entry points with health-aware routing. Key rule: Static global anycast IPs with fast regional failover point to AWS Global Accelerator."
  ref: "Q121 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-accelerators.html"
  exams: [saa-open]

- id: open-saa-q122
  kind: choice
  en: "A public web tier runs on EC2 and must remain available if one Availability Zone fails. The team wants requests distributed across instances in multiple AZs and unhealthy instances replaced automatically. Which design is the best fit?"
  options:
    - "A single NAT gateway in one AZ"
    - "One EC2 instance with a larger EBS volume"
    - "Application Load Balancer with an Auto Scaling group spanning multiple AZs"
    - "Amazon Athena with S3"
  correct: [C]
  why: "An ALB distributes traffic across healthy targets, and an Auto Scaling group spanning multiple Availability Zones can replace unhealthy instances and preserve capacity during an AZ failure. A single instance and unrelated services do not meet the resilience requirement. The key boundary is multi-AZ web-tier resilience with automated replacement. Key rule: Multi-AZ web resilience on EC2 points to ALB plus Auto Scaling across AZs."
  ref: "Q122 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html"
  exams: [saa-open]

- id: open-saa-q123
  kind: choice
  en: "An EC2 Auto Scaling group is behind an Application Load Balancer. The team wants instances replaced automatically when they stop passing application health checks even if the EC2 system status is still healthy. What should be enabled?"
  options:
    - "DynamoDB PITR"
    - "S3 versioning"
    - "A dead-letter queue"
    - "Elastic Load Balancing health checks for the Auto Scaling group"
  correct: [D]
  why: "By enabling ELB health checks for the Auto Scaling group, Auto Scaling can consider application-level target health from the load balancer when deciding to replace instances. EC2 status checks alone do not capture every app-level failure. The other options are unrelated. The key boundary is application-aware instance replacement. Key rule: If Auto Scaling should replace instances based on load balancer health, enable ELB health checks."
  ref: "Q123 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-elb-healthcheck.html"
  exams: [saa-open]

- id: open-saa-q124
  kind: choice
  en: "A microservices platform wants producers to emit internal business events once and let multiple downstream teams add consumers later without changing the producer code each time. Which integration style is the best fit?"
  options:
    - "Event-driven architecture with EventBridge"
    - "Direct point-to-point HTTP calls for each consumer"
    - "A shared root account access key"
    - "One monolithic relational database"
  correct: [A]
  why: "An event-driven architecture using EventBridge decouples producers from consumers so new downstream targets can be added with routing rules instead of modifying the producer for every new subscriber. Direct point-to-point calls create tight coupling. The key boundary is extensible internal event routing. Key rule: If producers should stay unaware of future consumers, use an event-driven routing model."
  ref: "Q124 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rules.html"
  exams: [saa-open]

- id: open-saa-q125
  kind: choice
  en: "A trading workflow requires ordered fan-out of messages to multiple downstream systems, and all subscribers must preserve ordering for a given message group. Which messaging combination is the best fit?"
  options:
    - "One shared standard SQS queue"
    - "SNS standard topic with SQS standard queues"
    - "SNS FIFO topic with SQS FIFO subscriptions"
    - "AWS Batch"
  correct: [C]
  why: "SNS FIFO with SQS FIFO subscribers preserves ordering and supports fan-out for workloads that need ordered delivery semantics across subscribers. Standard SNS/SQS does not provide the same ordering guarantees. The boundary is ordered pub/sub fan-out. Key rule: Ordered fan-out to multiple subscribers points to SNS FIFO with SQS FIFO subscriptions."
  ref: "Q125 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/sns/latest/dg/fifo-topic-message-ordering.html ; https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html"
  exams: [saa-open]

- id: open-saa-q126
  kind: choice
  en: "An Auto Scaling group of workers consumes messages from an SQS queue. The team wants scaling to reflect how much unprocessed work is waiting. Which metric is the most direct input?"
  options:
    - "ALB target response time"
    - "CPU utilization of one worker"
    - "ApproximateNumberOfMessagesVisible"
    - "EBS burst balance"
  correct: [C]
  why: "ApproximateNumberOfMessagesVisible is the SQS metric that most directly represents visible backlog waiting to be processed. CPU can still matter, but it is not the direct signal of queue depth. The key boundary is backlog-based worker scaling. Key rule: Queue-worker scaling should use SQS backlog metrics such as ApproximateNumberOfMessagesVisible."
  ref: "Q126 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html ; https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html"
  exams: [saa-open]

- id: open-saa-q127
  kind: choice
  en: "A team needs exactly one consumer group to process each message, but also wants to allow the consumer fleet to scale horizontally without producers being aware of worker count. Which service is the best fit?"
  options:
    - "AWS Global Accelerator"
    - "Route 53 latency routing"
    - "Amazon SNS topic"
    - "Amazon SQS"
  correct: [D]
  why: "Amazon SQS gives one-consumer-group queue semantics while allowing many workers to poll the queue horizontally. SNS is fan-out pub/sub where all subscribers receive the message. The key boundary is one logical work queue with scalable consumers. Key rule: If each message should be processed by one consumer fleet, use SQS rather than SNS fan-out."
  ref: "Q127 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-queue-types.html"
  exams: [saa-open]

- id: open-saa-q128
  kind: choice
  en: "A company wants Route 53 to stop returning a record when the endpoint is unhealthy, but all healthy records of the same name should continue serving traffic. Which failover style is this closest to?"
  options:
    - "Active-passive with one primary only"
    - "Active-active using health checks"
    - "A dead-letter queue pattern"
    - "No health checks at all"
  correct: [B]
  why: "Route 53 active-active behavior with health checks lets multiple healthy records serve traffic and removes unhealthy ones from responses. Active-passive is the primary/secondary standby model instead. The key boundary is all healthy endpoints being active rather than one designated standby pair. Key rule: Multiple healthy DNS endpoints serving together with health checks is active-active failover."
  ref: "Q128 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html"
  exams: [saa-open]

- id: open-saa-q129
  kind: choice
  en: "A globally distributed application needs a content delivery layer that caches static content near users and can reduce origin load during traffic spikes. Which AWS service is the best fit?"
  options:
    - "Amazon SQS"
    - "AWS Batch"
    - "AWS KMS"
    - "Amazon CloudFront"
  correct: [D]
  why: "Amazon CloudFront caches content at edge locations close to users, reducing origin load and improving latency for static or cacheable content. SQS, Batch, and KMS solve messaging, batch compute, and key management problems. The boundary is edge caching and content delivery. Key rule: Global edge caching and origin offload point to CloudFront."
  ref: "Q129 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HowCloudFrontWorks.html"
  exams: [saa-open]

- id: open-saa-q130
  kind: choice
  en: "A company needs a load balancer for a TCP-based service and the clients must be able to allowlist static IP addresses exposed by the service entry point. Which Elastic Load Balancing option is the best fit?"
  options:
    - "Application Load Balancer"
    - "Network Load Balancer"
    - "Classic Load Balancer for path routing"
    - "Gateway Load Balancer"
  correct: [B]
  why: "A Network Load Balancer is the Layer 4 load balancer option and provides static IP addresses, which makes it suitable when clients need allowlisting and the protocol is TCP or UDP. An Application Load Balancer focuses on HTTP/HTTPS and does not expose the same static IP model. The key boundary is Layer 4 traffic with static IP requirements. Key rule: TCP/UDP services needing static IPs point to a Network Load Balancer."
  ref: "Q130 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html"
  exams: [saa-open]

- id: open-saa-q131
  kind: choice
  en: "A company has several HTTP microservices and wants one entry point that can route requests based on hostnames and URL paths to different backends. Which load balancer is the best fit?"
  options:
    - "Network Load Balancer"
    - "Amazon SQS FIFO"
    - "Application Load Balancer"
    - "A single NAT gateway"
  correct: [C]
  why: "An Application Load Balancer is the right choice for HTTP/HTTPS traffic that needs host-based or path-based routing across multiple services. A Network Load Balancer is Layer 4 and does not provide the same application-layer routing logic. The key boundary is content-aware web routing. Key rule: Host- and path-based HTTP routing points to an Application Load Balancer."
  ref: "Q131 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-update-rules.html"
  exams: [saa-open]

- id: open-saa-q132
  kind: choice
  en: "An analytics pipeline needs a replayable ordered event stream so several applications can process the same data independently at different speeds. Which service is a better fit than SQS?"
  options:
    - "AWS WAF"
    - "Amazon SQS standard queue"
    - "AWS Secrets Manager"
    - "Amazon Kinesis Data Streams"
  correct: [D]
  why: "Kinesis Data Streams is built for replayable streaming consumption with multiple applications reading the same shard data independently. SQS is a queue that distributes messages for processing rather than a shared ordered stream. The key boundary is replayable shared streaming. Key rule: Replayable ordered stream consumption by multiple apps points to Kinesis Data Streams."
  ref: "Q132 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html"
  exams: [saa-open]

- id: open-saa-q133
  kind: choice
  en: "A producer should publish an event once and then forget about it, while downstream systems can subscribe or unsubscribe over time without any producer-side reconfiguration. Which service is the best fit?"
  options:
    - "Amazon EBS volume"
    - "AWS Global Accelerator"
    - "One shared SQS queue"
    - "Amazon SNS topic"
  correct: [D]
  why: "An SNS topic is the right pub/sub abstraction when producers should remain unaware of which consumers currently subscribe. A shared SQS queue is one work queue, not a decoupled subscription model for multiple independent consumers. The key boundary is producer-blind publish/subscribe. Key rule: If publishers should not know or manage subscribers, use SNS."
  ref: "Q133 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html"
  exams: [saa-open]

- id: open-saa-q134
  kind: choice
  en: "A company wants failed messages from an SQS source queue to move automatically into a separate queue only after a configurable number of receive attempts. Which setting controls that threshold?"
  options:
    - "Visibility timeout"
    - "maxReceiveCount in the redrive policy"
    - "Delivery delay"
    - "Message retention period"
  correct: [B]
  why: "The redrive policy uses maxReceiveCount to determine how many times a message can be received before SQS moves it to the dead-letter queue. Visibility timeout and retention period affect different behaviors. The key boundary is the failure-count threshold for DLQ movement. Key rule: The DLQ move threshold in SQS is controlled by maxReceiveCount."
  ref: "Q134 (Decoupling) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html ; https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-dead-letter-queue.html"
  exams: [saa-open]

- id: open-saa-q135
  kind: choice
  en: "A company uses Route 53 health checks with failover records. The team wants to understand what happens if every endpoint in a failover set is considered unhealthy. Which statement is the most accurate?"
  options:
    - "Route 53 can still return records as a last-resort behavior instead of returning no answer"
    - "The hosted zone becomes read-only"
    - "Route 53 permanently deletes the records"
    - "Route 53 converts the records into latency routing automatically"
  correct: [A]
  why: "Route 53 includes protective logic to avoid making some failover situations worse and can treat all records as healthy as a last-resort behavior rather than returning no answer at all. The other options are not how Route 53 failover works. The key boundary is DNS behavior during total-health-check failure scenarios. Key rule: If all failover endpoints are unhealthy, Route 53 can still return records as a last resort."
  ref: "Q135 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-problems.html ; https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html"
  exams: [saa-open]

- id: open-saa-q136
  kind: choice
  en: "A software company stores release packages in an Amazon S3 bucket and wants customers to download them through Amazon CloudFront. The bucket must not be directly reachable from the internet, and the team wants the AWS-recommended approach for new designs. Which option is the best fit?"
  options:
    - "Use an origin access identity (OAI) because it is the preferred modern method"
    - "Use a CloudFront distribution with origin access control (OAC) for the S3 origin"
    - "Place the files on an EC2 instance behind an Application Load Balancer"
    - "Make the bucket public and rely on CloudFront caching for scale"
  correct: [B]
  why: "Origin access control is the current AWS-recommended way to restrict access to an S3 origin behind CloudFront. It lets CloudFront send authenticated requests to S3 while keeping the bucket from being directly exposed. Making the bucket public defeats the requirement, and OAI is the legacy approach that AWS no longer recommends for new designs. Key rule: For private S3 content behind CloudFront, use OAC as the preferred access-control mechanism."
  ref: "Q136 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html"
  exams: [saa-open]

- id: open-saa-q137
  kind: choice
  en: "A licensing service grants a customer access to one installer file for 15 minutes after purchase. The client is a custom downloader that does not use browser cookies. Which approach should the architects choose?"
  options:
    - "CloudFront response headers policy"
    - "CloudFront signed URL"
    - "CloudFront signed cookie"
    - "CloudFront geographic restriction"
  correct: [B]
  why: "A signed URL is designed for granting temporary access to an individual object, and it works well for clients that do not rely on cookies. Signed cookies are better when access should cover multiple files without changing each URL. Geographic restriction and response headers policies solve different problems. Key rule: Use signed URLs when access is granted to one object and the client should not depend on cookies."
  ref: "Q137 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html"
  exams: [saa-open]

- id: open-saa-q138
  kind: choice
  en: "A subscription video portal serves thousands of segment files for each paid title through CloudFront. After login, a viewer should be able to access the full set of files for a short period without rewriting every media URL. Which option is best?"
  options:
    - "CloudFront price class"
    - "AWS WAF rate-based rules"
    - "CloudFront signed cookies"
    - "CloudFront signed URLs for each segment file"
  correct: [C]
  why: "Signed cookies let CloudFront authorize access to multiple restricted files while leaving the existing URLs unchanged, which fits video packages and subscriber areas. Signed URLs would require generating or managing a separate signed URL for each object. WAF and price class do not provide per-viewer private-content access control. Key rule: Use signed cookies when one authorization decision should cover many files without changing their URLs."
  ref: "Q138 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html"
  exams: [saa-open]

- id: open-saa-q139
  kind: choice
  en: "A media company can distribute one catalog globally except for a few titles that must be restricted at the city level in some countries. The team currently uses one CloudFront distribution for all titles. Which design best meets the requirement?"
  options:
    - "Use a third-party geolocation service with CloudFront signed URLs or cookies for the restricted titles"
    - "Use CloudFront standard logs to block requests after they occur"
    - "Use CloudFront geographic restrictions because they support city-level allow lists inside one distribution"
    - "Use only an origin request policy to forward the viewer IP address to the origin"
  correct: [A]
  why: "CloudFront geographic restrictions operate at the country level for an entire distribution. When restrictions apply only to a subset of files or need finer granularity such as city-level control, AWS documentation points to combining CloudFront with a third-party geolocation service and private-content controls. Forwarding headers or analyzing logs does not enforce the restriction by itself. Key rule: If geo restrictions must be finer than country-level or apply to only some files, CloudFront native geo restriction is not enough."
  ref: "Q139 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html"
  exams: [saa-open]

- id: open-saa-q140
  kind: choice
  en: "A multilingual website uses the same path for every article and selects language through a `lang` query string. The origin returns identical content except for the language variant. The team wants CloudFront to cache a separate copy per language without adding unnecessary cache fragmentation. What should they do?"
  options:
    - "Use an origin request policy to forward every query string while leaving the cache key unchanged"
    - "Disable caching so each request always reaches the origin"
    - "Forward all headers, all cookies, and all query strings to maximize cache correctness"
    - "Use a cache policy that includes only the `lang` query string in the cache key"
  correct: [D]
  why: "A cache policy controls which viewer request values become part of the cache key. Including only the `lang` query string creates distinct cached objects per language while avoiding unnecessary fragmentation from unrelated values. An origin request policy affects what reaches the origin but does not by itself create separate cached variants. Key rule: Use a cache policy to include only the minimal request values that must vary the cache."
  ref: "Q140 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-the-cache-key.html"
  exams: [saa-open]

- id: open-saa-q141
  kind: choice
  en: "An application serves the same image assets to all users through CloudFront, but the origin must still receive an `Authorization` header on cache misses for access checks. The team does not want that header to create separate cache entries. Which configuration is best?"
  options:
    - "Disable caching for the cache behavior"
    - "Attach an origin request policy that forwards the `Authorization` header without adding it to the cache key"
    - "Attach a cache policy that includes the `Authorization` header in the cache key"
    - "Use signed cookies instead of any forwarding policy"
  correct: [B]
  why: "An origin request policy controls what CloudFront sends to the origin without automatically making those values part of the cache key. That fits the case where the origin needs the header but cached objects should remain shared. Putting the header into the cache policy would fragment the cache by token or user. Key rule: When the origin needs request data but the cache should not vary on it, use an origin request policy."
  ref: "Q141 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-request-understand-origin-request-policy.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html"
  exams: [saa-open]

- id: open-saa-q142
  kind: choice
  en: "A storefront shows one of four region-specific landing pages based on a cookie named `country`. The marketing team wants CloudFront to cache one version per country value instead of forwarding every request to the origin. Which approach is best?"
  options:
    - "Configure CloudFront to cache based on the `country` cookie value"
    - "Enable CloudFront Origin Shield"
    - "Use only a response headers policy"
    - "Use signed URLs for the landing pages"
  correct: [A]
  why: "CloudFront can cache separate object variants based on selected cookie values. Caching on the specific `country` cookie gives one cache entry per region variant and avoids sending every request to the origin. Response headers policies, Origin Shield, and signed URLs do not create cookie-based cache variants. Key rule: If viewer content should vary by cookie, include the necessary cookie in CloudFront caching behavior."
  ref: "Q142 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Cookies.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-the-cache-key.html"
  exams: [saa-open]

- id: open-saa-q143
  kind: choice
  en: "A global marketing site needs to normalize incoming URLs and add a small viewer header at extremely high request rates. The logic is simple, must run with very low latency, and does not need network access or the request body. Which service is the best fit?"
  options:
    - "CloudFront Functions"
    - "Amazon API Gateway"
    - "Lambda@Edge"
    - "AWS Step Functions"
  correct: [A]
  why: "CloudFront Functions is designed for lightweight, latency-sensitive request and response manipulation at very high scale. The scenario does not need request-body inspection, filesystem access, or network calls, so Lambda@Edge would be heavier than necessary. API Gateway and Step Functions are unrelated to CDN edge customization. Key rule: Use CloudFront Functions for lightweight viewer request or response logic at massive scale."
  ref: "Q143 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html"
  exams: [saa-open]

- id: open-saa-q144
  kind: choice
  en: "An edge customization must inspect the HTTP request body and call an external authorization service before the origin request proceeds. Which option best fits this requirement?"
  options:
    - "CloudFront Functions"
    - "Lambda@Edge"
    - "CloudFront response headers policy"
    - "CloudFront standard logging"
  correct: [B]
  why: "Lambda@Edge supports heavier processing and can access the request body and external services, which CloudFront Functions cannot do. CloudFront Functions is for lightweight header and URL logic without network or body access. Response headers policies and logging do not execute custom authorization logic. Key rule: If edge logic needs request-body access or network calls, choose Lambda@Edge instead of CloudFront Functions."
  ref: "Q144 (Compute) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions.html"
  exams: [saa-open]

- id: open-saa-q145
  kind: choice
  en: "A retail company deploys new JavaScript bundles several times per day through CloudFront. The team wants users to receive new assets quickly without constantly issuing large invalidations. Which practice is the best fit?"
  options:
    - "Use signed cookies for JavaScript files"
    - "Set the CloudFront error caching TTL to zero"
    - "Invalidate `/*` after every deployment"
    - "Publish new files with versioned names and update application references"
  correct: [D]
  why: "AWS recommends versioned file names for updated content because they give immediate control over what viewers request and avoid repeated invalidation operations. Invalidating everything on every release is less efficient and can add cost or operational noise. Error caching and signed cookies do not solve deployment refresh for public static assets. Key rule: For frequently updated cached assets, prefer versioned file names over broad invalidations."
  ref: "Q145 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/UpdatingExistingObjects.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/invalidation-specifying-objects.html"
  exams: [saa-open]

- id: open-saa-q146
  kind: choice
  en: "A web application uses CloudFront in front of a custom origin. The team wants a friendly 503 page when the origin is unhealthy, and that page must still be available if the primary origin is down. What should they do?"
  options:
    - "Use an origin request policy to retry the request automatically until it succeeds"
    - "Store custom error pages in a separate location or origin that CloudFront can still access"
    - "Disable caching of all 5xx responses globally"
    - "Keep the custom error page on the same origin as the application so configuration stays simple"
  correct: [B]
  why: "CloudFront can return custom error pages, but AWS recommends keeping those pages in a location separate from the main origin. If the application origin itself is failing, CloudFront still needs a healthy place to retrieve the custom error content. The other options do not ensure the fallback page remains reachable. Key rule: If custom error pages must survive an origin outage, store them separately from the primary origin."
  ref: "Q146 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/custom-error-pages-procedure.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/custom-error-pages-different-locations.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesErrorPages.html"
  exams: [saa-open]

- id: open-saa-q147
  kind: choice
  en: "A newly fixed origin continues to show old 503 errors for too long because CloudFront cached the error response. The architects want CloudFront to retry the origin sooner after a failure is resolved. Which setting should they adjust?"
  options:
    - "Increase the default object TTL in the cache policy"
    - "Enable CloudFront geographic restrictions"
    - "Switch from CloudFront to Global Accelerator"
    - "Lower the Error Caching Minimum TTL for the relevant status code"
  correct: [D]
  why: "CloudFront caches some error responses, and the Error Caching Minimum TTL controls how long those errors remain cached. Reducing that value shortens the period that viewers continue to see stale error responses after the origin has recovered. Default object TTL, Global Accelerator, and geo restrictions do not target cached error behavior. Key rule: To make CloudFront stop serving cached errors sooner, reduce the error caching TTL for that status code."
  ref: "Q147 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/custom-error-pages-expiration.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesErrorPages.html"
  exams: [saa-open]

- id: open-saa-q148
  kind: choice
  en: "An origin receives large spikes of repeated requests for the same objects from many CloudFront edge locations, and the team wants an extra caching layer that reduces origin load and can improve cache hit ratio. Which feature is the best fit?"
  options:
    - "CloudFront signed cookies"
    - "CloudFront standard logging"
    - "CloudFront Origin Shield"
    - "CloudFront field-level encryption"
  correct: [C]
  why: "Origin Shield adds an additional centralized caching layer in front of the origin. AWS documents it as a way to reduce origin load and improve cache hit ratio when many edges request the same objects. The other options address access control, encryption, or observability instead of origin offload. Key rule: Use Origin Shield when you need an extra CloudFront caching layer to protect the origin."
  ref: "Q148 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html"
  exams: [saa-open]

- id: open-saa-q149
  kind: choice
  en: "An operations team wants CloudFront access records delivered within seconds so a streaming analytics pipeline can react to traffic anomalies in near real time. Which option should they use?"
  options:
    - "AWS Config rules for the distribution"
    - "Amazon S3 server access logging on the origin bucket"
    - "CloudFront standard logs written to Amazon S3 once per hour"
    - "CloudFront real-time logs delivered to Kinesis Data Streams"
  correct: [D]
  why: "CloudFront real-time logs are the feature designed for near-real-time request visibility, and they deliver records to Kinesis Data Streams. Standard logs are delayed and better for historical analysis, while Config and S3 access logging do not provide per-request CloudFront telemetry within seconds. Key rule: If CloudFront request analytics must arrive within seconds, use real-time logs with Kinesis Data Streams."
  ref: "Q149 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html"
  exams: [saa-open]

- id: open-saa-q150
  kind: choice
  en: "A team wants CloudFront request history for troubleshooting and periodic reporting, but it does not need second-by-second delivery and wants the simpler lower-overhead option. What is the best fit?"
  options:
    - "Use CloudFront Functions to write custom logs"
    - "Enable CloudFront real-time logs to a Kinesis stream"
    - "Enable CloudFront standard logging"
    - "Rely on Route 53 query logging"
  correct: [C]
  why: "Standard logging is the appropriate CloudFront feature for historical access logs when near-real-time delivery is not required. Real-time logs are built for live pipelines and add Kinesis integration and extra operational overhead. CloudFront Functions and Route 53 query logs do not replace CloudFront access logs. Key rule: Use standard logging for historical CloudFront request analysis when near-real-time delivery is unnecessary."
  ref: "Q150 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logging.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logs-reference.html"
  exams: [saa-open]

- id: open-saa-q151
  kind: choice
  en: "A company serves JavaScript and CSS through CloudFront and wants faster page delivery with lower transfer volume. The team is already using modern cache policies. Which change is most appropriate?"
  options:
    - "Create an origin request policy that forwards all headers"
    - "Use field-level encryption on the static assets"
    - "Invalidate the files more often"
    - "Enable CloudFront automatic compression with gzip and Brotli in the cache behavior"
  correct: [D]
  why: "CloudFront can automatically compress eligible objects and, with cache policies, support gzip and Brotli for faster delivery and lower transfer size. Forwarding more headers does not improve payload size, invalidations do not reduce transfer volume, and field-level encryption is unrelated to static asset compression. Key rule: Enable CloudFront compression for compressible content when you want smaller viewer payloads and faster delivery."
  ref: "Q151 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html"
  exams: [saa-open]

- id: open-saa-q152
  kind: choice
  en: "A security team wants every viewer response from CloudFront to include HSTS and several common security headers without modifying the origin application. Which feature should the architects use?"
  options:
    - "Use an origin request policy"
    - "Turn on standard logging"
    - "Attach a response headers policy to the cache behavior"
    - "Use CloudFront signed URLs"
  correct: [C]
  why: "A response headers policy adds or removes HTTP headers in the responses that CloudFront sends to viewers, including common security headers. This avoids changing the origin application for a header-only requirement. Origin request policies affect requests to the origin, not viewer response headers. Key rule: Use a response headers policy when CloudFront should add security or CORS headers to viewer responses."
  ref: "Q152 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/modifying-response-headers.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-response-headers-policies.html"
  exams: [saa-open]

- id: open-saa-q153
  kind: choice
  en: "A payment form is delivered through CloudFront, and the business wants specific sensitive POST fields encrypted at the edge so that only authorized backend components can decrypt them. Which CloudFront capability fits this requirement?"
  options:
    - "Price class"
    - "Field-level encryption"
    - "Origin Shield"
    - "Signed cookies"
  correct: [B]
  why: "CloudFront field-level encryption is built for encrypting selected data fields close to the viewer and keeping them encrypted through the application path until authorized components decrypt them. Signed cookies, Origin Shield, and price class do not encrypt form fields. Key rule: Use field-level encryption when specific request fields must be encrypted at the CloudFront edge."
  ref: "Q153 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/field-level-encryption.html"
  exams: [saa-open]

- id: open-saa-q154
  kind: choice
  en: "A platform team wants to test a new CloudFront cache configuration with a small percentage of real production traffic before promoting it to everyone. Which approach is the best fit?"
  options:
    - "Use standard logging to compare deployments after a full cutover"
    - "Use CloudFront continuous deployment with a staging distribution"
    - "Create a second DNS record and manually ask users to test it"
    - "Use CloudFront geographic restrictions to route 5% of users"
  correct: [B]
  why: "CloudFront continuous deployment is specifically designed to send a subset of real production traffic to a staging distribution so changes can be validated before promotion. The other options either require manual testing or misuse unrelated features. Key rule: When a CDN configuration should be tested on a subset of live traffic, use CloudFront continuous deployment."
  ref: "Q154 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/continuous-deployment.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-continuous-deployment.html"
  exams: [saa-open]

- id: open-saa-q155
  kind: choice
  en: "A company stores replicated static assets in multiple AWS Regions behind an S3 Multi-Region Access Point and wants to keep using CloudFront with private origin access. Which design best matches AWS guidance?"
  options:
    - "Use the S3 Multi-Region Access Point as the CloudFront origin and protect it with origin access control"
    - "Use an origin access identity because OAC is not supported with Multi-Region Access Points"
    - "Replace CloudFront with a direct public S3 Multi-Region Access Point URL"
    - "Expose each regional bucket publicly and use client-side logic to choose one"
  correct: [A]
  why: "CloudFront supports S3 Multi-Region Access Point origins and can protect them with origin access control. That keeps the global origin private while preserving CloudFront features. The other options either make the origin public or use the wrong legacy access mechanism. Key rule: For private CloudFront access to an S3 Multi-Region Access Point, use OAC with the MRAP origin."
  ref: "Q155 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3-mrap.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html"
  exams: [saa-open]

- id: open-saa-q156
  kind: choice
  en: "A team wants CloudFront in front of an Amazon S3 website endpoint and also wants the origin locked down with origin access control so users cannot bypass CloudFront. Which change is required?"
  options:
    - "Keep the website endpoint and attach OAC directly because website endpoints fully support OAC"
    - "Use signed cookies on the website endpoint because they replace OAC"
    - "Use the S3 bucket REST endpoint as the origin instead of the website endpoint so OAC can be used"
    - "Move the website to Amazon EFS because CloudFront cannot work with S3"
  correct: [C]
  why: "AWS documents that OAC applies to S3 bucket origins, not S3 website endpoints. Website endpoints are treated as custom origins, so if the design requires private CloudFront-to-S3 access with OAC, the origin must be the bucket REST endpoint rather than the website endpoint. The other choices do not satisfy that boundary. Key rule: If you need OAC with S3 and CloudFront, use an S3 bucket origin, not an S3 website endpoint."
  ref: "Q156 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html"
  exams: [saa-open]

- id: open-saa-q157
  kind: choice
  en: "A workload uploads objects through CloudFront to an Amazon S3 origin and also uses SSE-KMS on the bucket. The architects are reviewing whether to keep a legacy origin access identity or change it. Which choice is the best fit?"
  options:
    - "Keep origin access identity because it is the preferred option for dynamic S3 requests"
    - "Use CloudFront geographic restrictions to secure the upload path"
    - "Move to origin access control because it supports SSE-KMS and dynamic methods such as PUT and DELETE"
    - "Make the bucket public because CloudFront adds enough protection by itself"
  correct: [C]
  why: "Origin access control is the recommended mechanism for modern S3 origins and supports scenarios that OAI does not, including SSE-KMS and dynamic methods like PUT and DELETE. Keeping OAI would leave the design on a legacy path that AWS explicitly documents as more limited. Public access and geo restriction do not solve the origin-authentication requirement. Key rule: If a CloudFront-to-S3 design needs SSE-KMS or dynamic methods, prefer OAC over legacy OAI."
  ref: "Q157 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html"
  exams: [saa-open]

- id: open-saa-q158
  kind: choice
  en: "A distributor must block access to all content in a short list of countries, and the same restriction applies to the entire CloudFront distribution. Which feature is the simplest fit?"
  options:
    - "CloudFront geographic restrictions"
    - "A response headers policy"
    - "CloudFront signed URLs"
    - "An origin request policy"
  correct: [A]
  why: "CloudFront geographic restrictions are meant for country-level allow or deny lists that apply to an entire distribution. This is exactly the requirement described. Signed URLs, response headers policies, and origin request policies solve different access or request-handling problems. Key rule: Use CloudFront geographic restrictions when the rule is country-level and applies to the entire distribution."
  ref: "Q158 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html"
  exams: [saa-open]

- id: open-saa-q159
  kind: choice
  en: "A members portal serves a protected documentation library made of many HTML, CSS, image, and PDF files through CloudFront. After authentication, users should browse the library without the application generating a new signed link for every asset request. Which option is best?"
  options:
    - "CloudFront Origin Shield"
    - "CloudFront standard logging"
    - "CloudFront signed URLs for every object"
    - "CloudFront signed cookies"
  correct: [D]
  why: "Signed cookies allow the application to grant access to a collection of restricted files while keeping the underlying URLs unchanged. That is a better fit for a browsable library than signing every asset URL individually. Logging and Origin Shield do not provide private-content authorization. Key rule: When users should access many protected files after one authorization step, signed cookies are the better fit."
  ref: "Q159 (Security) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html"
  exams: [saa-open]

- id: open-saa-q160
  kind: choice
  en: "A global site serves localized content from the same path and determines the variant from the `Accept-Language` header. The team wants CloudFront to cache separate objects for different language headers, but only for that one header. What should they configure?"
  options:
    - "A response headers policy that adds `Accept-Language` to responses"
    - "An origin request policy that forwards all viewer headers"
    - "CloudFront geographic restrictions"
    - "A cache policy that includes the `Accept-Language` header in the cache key"
  correct: [D]
  why: "Because the content variant depends on a request header, CloudFront must include that specific header in the cache key. A cache policy is the mechanism that controls header-based cache variation. An origin request policy can forward headers to the origin, but it does not by itself create separate cached objects. Key rule: If content varies by a viewer header, include only that header in the CloudFront cache policy."
  ref: "Q160 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-key-understand-cache-policy.html ; https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-the-cache-key.html"
  exams: [saa-open]

- id: open-saa-q161
  kind: choice
  en: "A payments API publishes a custom CloudWatch metric named `CheckoutErrors`. The operations team wants an alert when the metric exceeds a fixed threshold for several consecutive evaluation periods. Which feature should they configure?"
  options:
    - "AWS Systems Manager Patch Manager"
    - "Amazon CloudWatch metric alarm"
    - "AWS Config managed rule"
    - "AWS Cost Explorer report"
  correct: [B]
  why: "A CloudWatch metric alarm is designed to watch a metric and change state when the metric breaches a threshold for the configured evaluation periods. AWS Config evaluates resource configuration, Cost Explorer analyzes spending, and Patch Manager automates patching. The boundary is threshold-based alerting on a metric. Key rule: Use a CloudWatch metric alarm when a metric crossing a threshold should trigger an alert."
  ref: "Q161 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Alarms.html"
  exams: [saa-open]

- id: open-saa-q162
  kind: choice
  en: "A web team has separate alarms for latency, 5xx errors, and unhealthy targets. They want to page the on-call engineer only when a combination of conditions indicates a real service incident, reducing duplicate notifications from individual alarms. What should they use?"
  options:
    - "AWS CloudTrail Lake query"
    - "AWS Budgets alert"
    - "CloudWatch dashboard only"
    - "CloudWatch composite alarm"
  correct: [D]
  why: "A CloudWatch composite alarm evaluates the states of other alarms using Boolean logic, which fits a higher-level health signal and reduces alarm noise. A dashboard visualizes data but does not page by itself, CloudTrail Lake queries API events, and Budgets alerts on cost thresholds. Key rule: Use composite alarms to combine multiple alarm states into one higher-level alert."
  ref: "Q162 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-combining.html ; https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Alarms.html"
  exams: [saa-open]

- id: open-saa-q163
  kind: choice
  en: "An application writes `PAYMENT_DECLINED` messages to CloudWatch Logs. The team wants to count those log events as a CloudWatch metric and alarm when the count rises quickly. Which feature is the best fit?"
