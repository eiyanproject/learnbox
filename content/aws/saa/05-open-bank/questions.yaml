  correct: [D]
  why: "Standard Workflows provide durable, auditable execution history and exactly-once workflow execution unless retries are explicitly configured, making them safer for non-idempotent payment steps. Express Workflows are optimized for high-rate short workloads and have different execution guarantees. Pipes and async Lambda do not provide the same workflow guarantees. Key rule: Use Standard Workflows for long-running auditable workflows with non-idempotent steps."
  ref: "Q235 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html"
  exams: [saa-open]

- id: open-saa-q236
  kind: choice
  en: "A business continuity team is documenting disaster recovery requirements. They need to define the maximum acceptable downtime and the maximum acceptable data loss after a disaster. Which pair of objectives captures these requirements?"
  options:
    - "CPU utilization and request latency"
    - "IAM policy and security group"
    - "MTU for downtime and TTL for data loss"
    - "RTO for downtime and RPO for data loss"
  correct: [D]
  why: "Recovery Time Objective defines the maximum acceptable delay before service is restored, while Recovery Point Objective defines the maximum acceptable data loss measured from the last recovery point. Network and security settings do not express disaster recovery targets. The boundary is DR objective definition. Key rule: Use RTO for maximum downtime and RPO for maximum data loss."
  ref: "Q236 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html ; https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"
  exams: [saa-open]

- id: open-saa-q237
  kind: choice
  en: "A low-priority internal reporting system can tolerate several hours of data loss and a full day to restore service after a Regional disaster. The company wants the lowest-cost DR strategy. Which strategy best matches?"
  options:
    - "Multi-AZ only in one Region"
    - "Warm standby"
    - "Backup and restore"
    - "Active-active multi-Region"
  correct: [C]
  why: "Backup and restore is the lowest-cost DR strategy in the Well-Architected guidance and fits workloads with relaxed RTO and RPO. Warm standby and active-active reduce recovery time but cost more, while Multi-AZ alone does not address Region-level disaster recovery. Key rule: Use backup and restore when DR objectives are relaxed and cost is the main constraint."
  ref: "Q237 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html ; https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/disaster-recovery-dr-objectives.html"
  exams: [saa-open]

- id: open-saa-q238
  kind: choice
  en: "A customer portal needs core infrastructure and replicated data already present in a recovery Region, but the application fleet can be scaled up during recovery. The company wants better RTO than backup and restore without running the full stack at all times. Which DR strategy fits?"
  options:
    - "Active-active multi-Region"
    - "Backup and restore only"
    - "Single-AZ standby"
    - "Pilot light"
  correct: [D]
  why: "Pilot light keeps the critical core of the workload and replicated data available in the recovery Region, then scales the rest during recovery. Backup and restore is slower, active-active runs full capacity in multiple Regions, and single-AZ standby is not a Regional DR strategy. Key rule: Use pilot light when core systems and data stay ready but full capacity is launched during recovery."
  ref: "Q238 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html"
  exams: [saa-open]

- id: open-saa-q239
  kind: choice
  en: "An ecommerce platform needs a recovery Region that already runs a scaled-down but complete copy of the application. During disaster recovery, the team will scale it up to production capacity. Which strategy is this?"
  options:
    - "Single-Region Multi-AZ"
    - "Backup and restore"
    - "Pilot light with only data replication"
    - "Warm standby"
  correct: [D]
  why: "Warm standby runs a functional but reduced-capacity copy of the workload in another Region, allowing faster recovery by scaling up. Pilot light usually keeps only core components ready, and backup and restore requires rebuilding more of the environment. Multi-AZ is intra-Region availability. Key rule: Warm standby keeps a scaled-down complete environment ready in the recovery Region."
  ref: "Q239 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html"
  exams: [saa-open]

- id: open-saa-q240
  kind: choice
  en: "A global application must serve users from multiple Regions at the same time and continue operating if one Region fails, with the lowest practical RTO. The company accepts the highest cost and operational complexity. Which DR strategy fits?"
  options:
    - "Pilot light"
    - "Backup and restore"
    - "Active-active multi-Region"
    - "Single-Region Multi-AZ"
  correct: [C]
  why: "Active-active multi-Region runs the workload in more than one Region simultaneously and offers the lowest recovery time, but with the highest cost and complexity. Backup and restore, pilot light, and single-Region Multi-AZ do not meet simultaneous multi-Region operation. Key rule: Use active-active multi-Region when the lowest RTO is required and cost/complexity are acceptable."
  ref: "Q240 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html"
  exams: [saa-open]

- id: open-saa-q241
  kind: choice
  en: "A compliance policy requires backups of supported AWS resources to be automatically copied to a second AWS Region. The team wants a managed backup service rather than custom snapshot scripts. Which service capability should they use?"
  options:
    - "AWS Backup cross-Region copy"
    - "Amazon Route 53 failover routing"
    - "AWS DMS change data capture"
    - "Amazon CloudFront origin failover"
  correct: [A]
  why: "AWS Backup can copy backups to another Region on demand or as part of a scheduled backup plan. Route 53 and CloudFront are traffic-layer features, and DMS CDC is for database migration replication. The boundary is managed backup copy across Regions. Key rule: Use AWS Backup cross-Region copy for managed backup copies in another Region."
  ref: "Q241 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html"
  exams: [saa-open]

- id: open-saa-q242
  kind: choice
  en: "A security team wants backup copies stored in a separate AWS account in the same organization so accidental deletion or compromise in the source account is less likely to remove all recovery points. Which AWS Backup feature fits?"
  options:
    - "CloudWatch composite alarm"
    - "Cross-account backup copy"
    - "RDS Multi-AZ deployment"
    - "Route 53 ARC zonal shift"
  correct: [B]
  why: "AWS Backup supports copying backups to another AWS account in the organization, which helps isolate recovery points from the source account. Zonal shift moves traffic away from an AZ, RDS Multi-AZ is database availability, and alarms do not isolate backups. Key rule: Use AWS Backup cross-account copy to isolate recovery points in another account."
  ref: "Q242 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html"
  exams: [saa-open]

- id: open-saa-q243
  kind: choice
  en: "A company wants disaster recovery for on-premises servers by continuously replicating them to AWS and launching recovery instances on EC2 during failover. Which AWS service is designed for this?"
  options:
    - "AWS Elastic Disaster Recovery"
    - "AWS Backup only"
    - "AWS Database Migration Service"
    - "AWS DataSync"
  correct: [A]
  why: "AWS Elastic Disaster Recovery continuously replicates source servers and can launch recovery instances in AWS during a failover. AWS Backup protects supported resources, DataSync transfers files, and DMS migrates database data. The boundary is server-level disaster recovery to EC2. Key rule: Use AWS Elastic Disaster Recovery for continuous server replication and EC2 recovery launch."
  ref: "Q243 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/drs/latest/userguide/failback-preparing-failover.html"
  exams: [saa-open]

- id: open-saa-q244
  kind: choice
  en: "A disaster recovery team wants to test recovery of protected servers without disrupting production traffic. They also want to validate launch settings and recovery procedures before an actual event. What should they run?"
  options:
    - "CloudFront invalidation"
    - "AWS Budgets forecast"
    - "A production failover without testing"
    - "AWS Elastic Disaster Recovery drill instances"
  correct: [D]
  why: "Elastic Disaster Recovery supports launching drill instances so teams can test recovery without affecting production. Running an untested production failover is risky, and CloudFront or Budgets features are unrelated to server recovery validation. Key rule: Use DRS drills to validate recovery procedures without interrupting production."
  ref: "Q244 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/drs/latest/userguide/preparing-failover.html"
  exams: [saa-open]

- id: open-saa-q245
  kind: choice
  en: "An Application Load Balancer-backed service is experiencing a bad deployment in one Availability Zone. The team wants to temporarily move traffic away from that impaired AZ while keeping the service in the same Region. Which capability should be used?"
  options:
    - "AWS Backup cross-Region copy"
    - "Amazon Application Recovery Controller zonal shift"
    - "Route 53 latency routing"
    - "Aurora Global Database failover"
  correct: [B]
  why: "ARC zonal shift temporarily moves traffic for supported resources away from an impaired Availability Zone to healthy AZs in the same Region. Route 53 latency routing is DNS-based global routing, backups protect data, and Aurora Global Database is database DR. Key rule: Use ARC zonal shift for temporary recovery from a single-AZ impairment."
  ref: "Q245 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html"
  exams: [saa-open]

- id: open-saa-q246
  kind: choice
  en: "A multi-Region application uses Route 53 records to direct traffic to active and standby cells. Operators need highly reliable manual switches to control which cell receives traffic during recovery. Which ARC capability fits?"
  options:
    - "AWS Backup vault lock"
    - "S3 Lifecycle rules"
    - "Routing controls integrated with Route 53 health checks"
    - "CloudWatch dashboards only"
  correct: [C]
  why: "ARC routing controls are highly reliable on/off switches that can be integrated with Route 53 health checks to reroute traffic between cells such as Regions or AZs. Dashboards and backup features do not provide recovery traffic controls. Key rule: Use ARC routing controls when operators need reliable manual traffic failover switches."
  ref: "Q246 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html"
  exams: [saa-open]

- id: open-saa-q247
  kind: choice
  en: "Before a Region failover, a team wants ongoing checks that compare whether required resources in each recovery cell are ready and similarly configured. Which ARC capability addresses recovery readiness?"
  options:
    - "ARC readiness checks"
    - "AWS WAF managed rules"
    - "CloudFront real-time logs"
    - "AWS Cost Explorer"
  correct: [A]
  why: "ARC readiness checks audit resource sets and help determine whether application cells are ready for recovery. Logs, WAF, and cost analysis do not evaluate recovery readiness across cells. The boundary is validating failover readiness. Key rule: Use ARC readiness checks to monitor whether recovery resources are ready for failover."
  ref: "Q247 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/r53recovery/latest/dg/recovery-readiness.html"
  exams: [saa-open]

- id: open-saa-q248
  kind: choice
  en: "A globally distributed application uses Aurora PostgreSQL and needs low-latency reads in multiple Regions plus faster recovery from a Region-wide database outage. Writes normally go to one primary Region. Which database feature is the best fit?"
  options:
    - "Amazon Aurora Global Database"
    - "RDS Multi-AZ deployment only"
    - "DynamoDB global tables"
    - "AWS Backup cross-account copy"
  correct: [A]
  why: "Aurora Global Database spans multiple Regions with one primary Region for writes and read-only secondary Regions for low-latency reads and disaster recovery. RDS Multi-AZ is regional, DynamoDB global tables are for DynamoDB, and backups are slower recovery. Key rule: Use Aurora Global Database for Aurora multi-Region reads and faster Regional database recovery."
  ref: "Q248 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"
  exams: [saa-open]

- id: open-saa-q249
  kind: choice
  en: "A team uses Aurora Global Database and wants application write connections to follow the current primary Region after a managed switchover or failover without changing connection strings manually. Which endpoint should they use?"
  options:
    - "An individual reader endpoint in each secondary Region"
    - "An S3 Multi-Region Access Point alias"
    - "Aurora Global Database writer endpoint"
    - "A CloudFront distribution endpoint"
  correct: [C]
  why: "Aurora Global Database provides a writer endpoint that automatically points to the current primary DB cluster after supported switchover or failover operations. Reader endpoints are for reads, and CloudFront or S3 aliases do not route database writes. Key rule: Use the Aurora Global Database writer endpoint for write connections that follow the current primary Region."
  ref: "Q249 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-connecting.html ; https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html"
  exams: [saa-open]

- id: open-saa-q250
  kind: choice
  en: "A team wants to improve availability of an Amazon RDS database against instance or Availability Zone failure inside one Region. They do not need cross-Region disaster recovery. Which feature should they use?"
  options:
    - "AWS Snowball Edge"
    - "Route 53 weighted routing"
    - "RDS Multi-AZ deployment"
    - "Aurora Global Database"
  correct: [C]
  why: "RDS Multi-AZ deployments provide high availability and failover within a Region by maintaining standby capacity in a different Availability Zone. Aurora Global Database is cross-Region, Snowball is for data transfer, and weighted routing is not database HA. Key rule: Use RDS Multi-AZ for in-Region database high availability across Availability Zones."
  ref: "Q250 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html"
  exams: [saa-open]

- id: open-saa-q251
  kind: choice
  en: "A serverless application stores global user preferences in DynamoDB and requires low-latency reads and writes in several Regions. Which data feature is the best fit?"
  options:
    - "DynamoDB global tables"
    - "Aurora read replicas"
    - "S3 Cross-Region Replication"
    - "RDS Multi-AZ"
  correct: [A]
  why: "DynamoDB global tables provide multi-Region, active-active replication for DynamoDB tables, allowing local reads and writes in multiple Regions. Aurora replicas and RDS Multi-AZ are relational features, and S3 replication is for objects. Key rule: Use DynamoDB global tables for multi-Region active-active DynamoDB access."
  ref: "Q251 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html"
  exams: [saa-open]

- id: open-saa-q252
  kind: choice
  en: "A company stores compliance documents in Amazon S3 and wants new objects copied automatically to a bucket in another Region. The goal is object-level replication, not full application failover. What should it configure?"
  options:
    - "Route 53 ARC routing controls"
    - "Amazon S3 Replication"
    - "RDS Multi-AZ"
    - "AWS Elastic Disaster Recovery"
  correct: [B]
  why: "S3 Replication automatically copies objects from one bucket to another bucket in the same or different Region. Elastic Disaster Recovery protects servers, RDS Multi-AZ protects databases inside a Region, and ARC controls traffic failover. Key rule: Use S3 Replication for automatic object copies to another bucket or Region."
  ref: "Q252 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html"
  exams: [saa-open]

- id: open-saa-q253
  kind: choice
  en: "A simple active-passive website has a primary endpoint and a secondary endpoint. DNS should send users to the secondary endpoint only when health checks show the primary is unhealthy. Which Route 53 routing policy should be used?"
  options:
    - "Geoproximity routing policy"
    - "Failover routing policy"
    - "Weighted routing policy"
    - "Multivalue answer routing only"
  correct: [B]
  why: "Route 53 failover routing is designed for active-passive DNS failover using health checks to route to the secondary endpoint when the primary is unhealthy. Weighted and geoproximity routing solve traffic distribution and location bias, not basic active-passive failover. Key rule: Use Route 53 failover routing for active-passive DNS failover."
  ref: "Q253 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html"
  exams: [saa-open]

- id: open-saa-q254
  kind: choice
  en: "A stateless web tier should remain available if one Availability Zone fails. The team wants instances distributed across multiple AZs and replacement capacity launched automatically. Which design is most appropriate?"
  options:
    - "Single EC2 instance with larger instance size"
    - "S3 Lifecycle transition policy"
    - "Application Load Balancer with an Auto Scaling group spanning multiple Availability Zones"
    - "One NAT gateway shared by all private subnets"
  correct: [C]
  why: "An Application Load Balancer across enabled AZs with an Auto Scaling group spanning multiple AZs is the standard resilient pattern for stateless web tiers. A single larger instance is still a single point of failure, and NAT or lifecycle settings do not provide web-tier HA. Key rule: Use ALB plus Auto Scaling across multiple AZs for resilient stateless web tiers."
  ref: "Q254 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html"
  exams: [saa-open]

- id: open-saa-q255
  kind: choice
  en: "A service behind an Application Load Balancer plans to use ARC zonal shift during an AZ impairment. What must the team consider before shifting traffic away from one AZ?"
  options:
    - "Zonal shift permanently disables the impaired Availability Zone"
    - "The remaining AZs must have enough capacity to absorb the shifted traffic"
    - "AWS Backup must restore all EC2 instances first"
    - "Zonal shift automatically creates new subnets in another Region"
  correct: [B]
  why: "ARC zonal shift moves traffic away from one AZ to the remaining healthy AZs, so the application must be pre-scaled or able to scale enough to handle the extra load. It does not create subnets, permanently disable AZs, or restore instances from backup. Key rule: Before using zonal shift, ensure remaining AZs have enough capacity for shifted traffic."
  ref: "Q255 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/r53recovery/latest/dg/route53-arc-best-practices.zonal-shifts.html ; https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html"
  exams: [saa-open]

- id: open-saa-q256
  kind: choice
  en: "A workload is highly available across three Availability Zones in one Region. Leadership asks whether this alone satisfies a requirement to survive complete Region loss. What is the correct assessment?"
  options:
    - "No; Multi-AZ is useful only for storage services"
    - "No; Multi-AZ improves Regional availability but a separate multi-Region DR strategy is needed for Region loss"
    - "Yes; Route 53 automatically recreates the workload in another Region"
    - "Yes; using three AZs always protects against Region-wide disasters"
  correct: [B]
  why: "Multi-AZ architecture improves availability against AZ-level or component failures inside a Region, but it does not by itself provide recovery from a full Region outage. Region-level DR requires a strategy such as backup and restore, pilot light, warm standby, or active-active across Regions. Key rule: Multi-AZ is not the same as multi-Region disaster recovery."
  ref: "Q256 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html ; https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html"
  exams: [saa-open]

- id: open-saa-q257
  kind: choice
  en: "A team wants to use ARC zonal shift for recovery from an impaired Availability Zone. The application currently runs at just enough capacity across all AZs and cannot scale quickly. What is the main risk?"
  options:
    - "AWS Backup will delete cross-Region copies"
    - "The healthy AZs may not have enough capacity after traffic is shifted"
    - "DynamoDB global tables will become single-Region"
    - "Route 53 health checks will stop working globally"
  correct: [B]
  why: "Zonal shift removes traffic from one AZ, so the remaining AZs must carry the additional load. AWS recommends capacity planning and pre-scaling for this reason. The other options are unrelated effects. Key rule: Zonal shift requires enough healthy-AZ capacity to absorb shifted traffic."
  ref: "Q257 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/r53recovery/latest/dg/route53-arc-best-practices.zonal-shifts.html ; https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html"
  exams: [saa-open]

- id: open-saa-q258
  kind: choice
  en: "A team relies only on DNS failover for disaster recovery. The application stack, data replication, and capacity in the secondary Region are not tested. What is the key problem with this plan?"
  options:
    - "DNS failover can route traffic, but it does not prove the recovery Region is ready to serve the application"
    - "AWS WAF must be disabled before failover"
    - "Route 53 failover automatically replicates all databases"
    - "DNS failover is never useful for DR"
  correct: [A]
  why: "Route 53 failover can direct traffic based on health checks, but recovery also depends on application deployment, data, capacity, and readiness in the target Region. DNS routing alone cannot guarantee application recovery. The boundary is traffic routing versus end-to-end DR readiness. Key rule: DNS failover is only one part of DR; the recovery environment must be ready and tested."
  ref: "Q258 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-failover.html ; https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"
  exams: [saa-open]

- id: open-saa-q259
  kind: choice
  en: "After using AWS Elastic Disaster Recovery to launch recovery instances in AWS, a company later wants to return workloads to the original source environment after it is repaired. Which DRS process is involved?"
  options:
    - "S3 replication"
    - "CloudFront origin failover"
    - "Failback"
    - "DynamoDB point-in-time recovery"
  correct: [C]
  why: "Elastic Disaster Recovery failback is the process of restoring workloads from recovery instances back to the original or source environment after a failover. S3 replication, CloudFront failover, and DynamoDB restore do not return recovered servers to the source site. Key rule: Use DRS failback to return workloads to the source environment after recovery."
  ref: "Q259 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/drs/latest/userguide/failback-preparing-failover.html"
  exams: [saa-open]

- id: open-saa-q260
  kind: choice
  en: "A company wants object data in Amazon S3 to be available in another Region for compliance and recovery planning. It also needs a separate backup plan for supported resources such as EBS and RDS. Which statement is most accurate?"
  options:
    - "Use S3 Replication for object replication and AWS Backup for managed backup plans across supported services"
    - "Use RDS Multi-AZ for all S3 and EBS recovery needs"
    - "Use Route 53 failover routing to replicate S3 objects and EBS volumes"
    - "Use ARC zonal shift to copy data between Regions"
  correct: [A]
  why: "S3 Replication handles object-level replication between buckets, while AWS Backup manages backup plans and copies for supported AWS resources such as EBS and RDS. DNS failover, RDS Multi-AZ, and ARC zonal shift do not replicate object and backup data across services. Key rule: Use service-specific replication for S3 objects and AWS Backup for managed backups of supported resources."
  ref: "Q260 (High Availability & Resilience) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html ; https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html"
  exams: [saa-open]

- id: open-saa-q261
  kind: choice
  en: "A central security team wants to prevent member accounts from disabling CloudTrail, even if an administrator in a member account attaches an overly permissive IAM policy. Which control should they use?"
  options:
    - "IAM user inline policy in each account"
    - "AWS Organizations service control policy"
    - "AWS Cost Category"
    - "Security group egress rule"
  correct: [B]
  why: "A service control policy sets the maximum available permissions for accounts in an AWS Organization, so it can prevent actions even when local IAM policies would otherwise allow them. IAM policies inside each account are easier for local administrators to bypass if they can edit permissions. Security groups and Cost Categories do not govern API permissions. Key rule: Use SCPs for organization-wide maximum permission guardrails across member accounts."
  ref: "Q261 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"
  exams: [saa-open]

- id: open-saa-q262
  kind: choice
  en: "A company is building a landing zone and wants managed preventive and detective controls applied at the OU level for enrolled accounts. Which AWS service is designed for this governance model?"
  options:
    - "Amazon GuardDuty only"
    - "AWS Cost and Usage Reports"
    - "AWS Control Tower controls"
    - "AWS Compute Optimizer"
  correct: [C]
  why: "AWS Control Tower provides controls for governing accounts and OUs in a landing zone, including preventive, detective, and proactive controls. Compute Optimizer makes rightsizing recommendations, GuardDuty detects threats, and CUR exports billing data. The boundary is landing-zone governance. Key rule: Use AWS Control Tower controls for managed landing-zone governance across OUs and accounts."
  ref: "Q262 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/controltower/latest/controlreference/controls.html"
  exams: [saa-open]

- id: open-saa-q263
  kind: choice
  en: "A network account owns shared subnets, and application accounts in the same AWS Organization need to launch EC2 instances into those centrally managed subnets. Which AWS feature enables this model?"
  options:
    - "VPC peering between every application account"
    - "CloudFront signed cookies"
    - "VPC subnet sharing through AWS RAM"
    - "AWS Transfer Family"
  correct: [C]
  why: "VPC subnet sharing lets a VPC owner share subnets with participant accounts in the same organization, allowing those accounts to place supported resources into the shared subnets. VPC peering connects VPCs but does not let accounts launch resources into the same subnet. Key rule: Use VPC subnet sharing when multiple accounts should deploy resources into centrally managed subnets."
  ref: "Q263 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html"
  exams: [saa-open]

- id: open-saa-q264
  kind: choice
  en: "A platform team wants to share a supported resource, such as a subnet or license configuration, with several AWS accounts in an OU without copying the resource into each account. Which service should they use?"
  options:
    - "AWS Resource Access Manager"
    - "AWS Systems Manager Patch Manager"
    - "AWS Backup"
    - "Amazon Macie"
  correct: [A]
  why: "AWS RAM securely shares supported resources across AWS accounts, OUs, or an organization. It does not duplicate the resource; consuming accounts receive access according to the resource share and their permissions. Backup, Patch Manager, and Macie solve unrelated problems. Key rule: Use AWS RAM to share supported AWS resources across accounts or OUs."
  ref: "Q264 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/ram/latest/userguide/working-with-sharing-create.html"
  exams: [saa-open]

- id: open-saa-q265
  kind: choice
  en: "A company uses licensed Microsoft and Oracle software across accounts and wants to track BYOL usage, set license rules, and reduce the risk of overusing entitlements. Which AWS service is the best fit?"
  options:
    - "AWS License Manager"
    - "AWS Config aggregator only"
    - "AWS Cost Explorer"
    - "Amazon Inspector"
  correct: [A]
  why: "AWS License Manager helps manage software licenses across accounts and Regions, including BYOL tracking and license rule enforcement. Cost Explorer analyzes spend, Config aggregates compliance data, and Inspector scans for vulnerabilities. The boundary is license compliance and usage tracking. Key rule: Use AWS License Manager for license tracking and BYOL governance across AWS environments."
  ref: "Q265 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html"
  exams: [saa-open]

- id: open-saa-q266
  kind: choice
  en: "A company has steady compute usage across EC2, Fargate, and Lambda and wants flexible discounts without committing to a specific EC2 instance family, size, or Region. Which pricing model best fits?"
  options:
    - "Spot Instances only"
    - "Compute Savings Plans"
    - "AWS Budgets"
    - "EC2 Reserved Instances for one instance family"
  correct: [B]
  why: "Compute Savings Plans provide discounted compute pricing in exchange for a dollar-per-hour commitment and can apply across EC2 instance families, sizes, Regions, operating systems, Fargate, and Lambda. EC2 Reserved Instances are less flexible, Spot is spare capacity, and Budgets only alerts on spend. Key rule: Use Compute Savings Plans for flexible compute discounts across EC2, Fargate, and Lambda."
  ref: "Q266 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html"
  exams: [saa-open]

- id: open-saa-q267
  kind: choice
  en: "A team wants a billing discount for a known EC2 workload and also needs a capacity reservation in one specific Availability Zone. Which purchase option can provide both when scoped correctly?"
  options:
    - "Compute Savings Plan"
    - "Cost Category"
    - "Zonal EC2 Reserved Instance"
    - "AWS Budget"
  correct: [C]
  why: "An EC2 Reserved Instance purchased for a specific Availability Zone can provide a capacity reservation as well as a billing discount. Compute Savings Plans provide flexible discounts but do not reserve specific capacity. Budgets and Cost Categories do not reserve compute capacity. Key rule: Use a zonal EC2 Reserved Instance when both discount and AZ-specific capacity reservation are required."
  ref: "Q267 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/whitepapers/latest/cost-optimization-reservation-models/amazon-ec2-reserved-instances.html"
  exams: [saa-open]

- id: open-saa-q268
  kind: choice
  en: "A finance team wants automated alerts when AWS spend suddenly deviates from normal historical patterns, without manually setting a fixed budget threshold for every account. Which feature is the best fit?"
  options:
    - "EC2 Reserved Instances"
    - "AWS License Manager"
    - "AWS Cost Categories"
    - "AWS Cost Anomaly Detection"
  correct: [D]
  why: "AWS Cost Anomaly Detection uses monitors and alert subscriptions to identify unusual cost patterns automatically. Cost Categories group costs, RIs provide discounts, and License Manager tracks software entitlements. The boundary is anomaly-based cost alerting. Key rule: Use Cost Anomaly Detection for automated alerts on unusual spending patterns."
  ref: "Q268 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html"
  exams: [saa-open]

- id: open-saa-q269
  kind: choice
  en: "A company wants to map AWS charges into internal business units using rules based on linked accounts, tags, services, and Regions. Which billing feature should it configure?"
  options:
    - "AWS CloudTrail Lake"
    - "Savings Plans recommendations"
    - "AWS Budgets"
    - "AWS Cost Categories"
  correct: [D]
  why: "AWS Cost Categories let organizations define rules that group AWS costs into meaningful business categories such as teams, products, or business units. Budgets alerts on thresholds, Savings Plans reduce eligible usage cost, and CloudTrail Lake queries API events. Key rule: Use Cost Categories to allocate and group AWS costs by internal business rules."
  ref: "Q269 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-cost-categories.html"
  exams: [saa-open]

- id: open-saa-q270
  kind: choice
  en: "A company bought Savings Plans in its management account and has sharing enabled in consolidated billing. How are the benefits applied across eligible usage?"
  options:
    - "Savings Plans reserve EC2 capacity in each Availability Zone"
    - "Savings Plans require manual attachment to every Lambda function"
    - "Savings Plans apply only to the exact EC2 instance ID used when purchased"
    - "Savings Plans apply automatically to eligible usage and can apply across accounts when sharing is enabled"
  correct: [D]
  why: "Savings Plans apply automatically to eligible usage, and in a consolidated billing family they can apply across accounts when sharing is enabled. They are billing commitments, not capacity reservations, and are not attached to individual functions or instances. Key rule: Savings Plans are automatic billing discounts for eligible usage, not capacity reservations."
  ref: "Q270 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-applying.html"
  exams: [saa-open]

- id: open-saa-q271
  kind: choice
  en: "A platform team wants recommendations for a Savings Plans hourly commitment based on historical usage and existing coverage. Where should they look?"
  options:
    - "AWS License Manager inventory"
    - "Savings Plans recommendations in AWS Cost Management"
    - "AWS Config managed rules"
    - "VPC Flow Logs"
  correct: [B]
  why: "AWS provides Savings Plans recommendations based on historical usage to help estimate an appropriate commitment and potential savings. Config, Flow Logs, and License Manager do not calculate Savings Plans commitments. Key rule: Use Savings Plans recommendations to evaluate commitment levels based on past usage."
  ref: "Q271 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html"
  exams: [saa-open]

- id: open-saa-q272
  kind: choice
  en: "A central platform team wants to standardize tag keys and allowed values across accounts in AWS Organizations. The goal is tag governance, not cost grouping after charges are generated. Which policy type fits?"
  options:
    - "AWS Cost Category"
    - "IAM permissions boundary"
    - "CloudWatch dashboard"
    - "AWS Organizations tag policy"
  correct: [D]
  why: "Tag policies help standardize tag keys and values across AWS Organizations accounts. Cost Categories group charges for billing analysis but do not enforce or standardize resource tag values. IAM boundaries and dashboards solve different problems. Key rule: Use tag policies for organization-wide tag standardization."
  ref: "Q272 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html"
  exams: [saa-open]

- id: open-saa-q273
  kind: choice
  en: "A security team says an SCP should grant developers access to Amazon S3 in member accounts. What is the correct response?"
  options:
    - "SCPs grant permissions only to root users"
    - "SCPs replace all IAM policies in member accounts"
    - "SCPs are used only for billing alerts"
    - "SCPs do not grant permissions; they set maximum available permissions"
  correct: [D]
  why: "SCPs do not grant permissions. They define the maximum permissions available to accounts in an organization, and identities still need IAM permissions or resource policies that allow the action. The other statements misunderstand SCP behavior. Key rule: SCPs constrain permissions but do not grant them."
  ref: "Q273 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"
  exams: [saa-open]

- id: open-saa-q274
  kind: choice
  en: "A company has dozens of VPCs and several VPN attachments that need centralized routing with route tables and segmentation. Full mesh VPC peering is becoming unmanageable. Which service should be used?"
  options:
    - "AWS Transit Gateway"
    - "Amazon Route 53 Resolver"
    - "AWS PrivateLink endpoint service"
    - "AWS RAM only"
  correct: [A]
  why: "AWS Transit Gateway acts as a central router for VPC and VPN attachments and supports route tables for segmentation. PrivateLink exposes services privately but does not provide general VPC-to-VPC routing. RAM can share resources, and Resolver handles DNS. Key rule: Use Transit Gateway for centralized hub-and-spoke routing across many VPCs and hybrid attachments."
  ref: "Q274 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-centralized-router.html ; https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html"
  exams: [saa-open]

- id: open-saa-q275
  kind: choice
  en: "A SaaS provider wants customers in other VPCs to access its service privately without opening inbound internet access or requiring VPC peering with every customer. The provider can place the service behind a Network Load Balancer. Which AWS feature fits?"
  options:
    - "AWS PrivateLink endpoint service"
    - "AWS Transit Gateway peering"
    - "VPC Flow Logs"
    - "Route 53 public hosted zone"
  correct: [A]
  why: "A PrivateLink endpoint service lets a provider expose a service privately to consumers through interface endpoints, commonly using a Network Load Balancer. Transit Gateway is for routing networks, Route 53 public zones expose DNS publicly, and Flow Logs are observability. Key rule: Use PrivateLink endpoint services to expose provider services privately to consumer VPCs."
  ref: "Q275 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/privatelink/create-endpoint-service.html ; https://docs.aws.amazon.com/whitepapers/latest/aws-privatelink/how-does-aws-privatelink-work.html"
  exams: [saa-open]

- id: open-saa-q276
  kind: choice
  en: "A large organization frequently creates VPCs in multiple accounts and Regions. It wants centralized planning, allocation, and monitoring of CIDR blocks to avoid overlapping address space. Which AWS feature is the best fit?"
  options:
    - "CloudFront origin groups"
    - "AWS Cost Categories"
    - "Amazon VPC IP Address Manager"
    - "AWS Backup vault lock"
  correct: [C]
  why: "Amazon VPC IPAM helps plan, allocate, track, and monitor IP address space across AWS workloads, accounts, and Regions. Cost Categories, Backup, and CloudFront origin groups do not manage CIDR allocation. The boundary is centralized IP address management. Key rule: Use VPC IPAM to manage and monitor IP address space across accounts and Regions."
  ref: "Q276 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html ; https://docs.aws.amazon.com/vpc/latest/ipam/how-it-works-ipam.html"
  exams: [saa-open]

- id: open-saa-q277
  kind: choice
  en: "A networking team needs to allocate VPC CIDR blocks automatically from preapproved pools that reflect Region and environment boundaries. Which VPC IPAM concept is directly involved?"
  options:
    - "IPAM pools and allocations"
    - "AWS License Manager rules"
    - "CloudWatch composite alarms"
    - "Savings Plans commitments"
  correct: [A]
  why: "IPAM pools organize contiguous CIDR ranges, and allocations assign CIDRs from pools to resources such as VPCs. The other options do not allocate network address ranges. The boundary is controlled VPC CIDR provisioning. Key rule: Use IPAM pools and allocations to assign VPC CIDRs from governed address ranges."
  ref: "Q277 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/ipam/how-it-works-ipam.html ; https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html"
  exams: [saa-open]

- id: open-saa-q278
  kind: choice
  en: "A Transit Gateway has production and shared-services VPC attachments. The network team wants production VPCs to reach shared services but not other production VPCs. Which Transit Gateway feature supports this segmentation?"
  options:
    - "CloudFront geographic restrictions"
    - "AWS Budgets action"
    - "One security group attached to the transit gateway"
    - "Separate transit gateway route tables with selective association and propagation"
  correct: [D]
  why: "Transit Gateway route tables can be associated with attachments and selectively receive propagated or static routes, enabling segmentation between groups of VPCs. Security groups do not attach to transit gateways, and CloudFront or Budgets features are unrelated. Key rule: Use Transit Gateway route tables to segment routing between attachments."
  ref: "Q278 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html ; https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-centralized-router.html"
  exams: [saa-open]

- id: open-saa-q279
  kind: choice
  en: "A networking account owns a VPC and wants application accounts to deploy resources into selected subnets, but application teams should not modify the VPC route tables or shared network infrastructure. Which pattern is appropriate?"
  options:
    - "VPC sharing with participant accounts"
    - "VPC peering from every application account"
    - "Public subnets in each application account"
    - "AWS Transfer Family"
  correct: [A]
  why: "With VPC sharing, the owner account shares subnets with participant accounts, and participants can create supported resources in shared subnets without owning the VPC infrastructure. Peering creates separate VPCs and does not provide shared subnet placement. Key rule: Use VPC sharing when a central network account owns subnets used by participant accounts."
  ref: "Q279 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html"
  exams: [saa-open]

- id: open-saa-q280
  kind: choice
  en: "A company uses Direct Connect and wants private connectivity to VPCs in multiple Regions through a central construct instead of creating separate connections everywhere. Which feature helps with this?"
  options:
    - "Cost Category"
    - "PrivateLink endpoint service"
    - "Direct Connect gateway"
    - "Transit Gateway route table only"
  correct: [C]
  why: "A Direct Connect gateway enables a Direct Connect connection to connect to VPCs in multiple Regions through supported attachments. Transit Gateway route tables segment routing but are not the Direct Connect multi-Region construct. PrivateLink exposes services privately, and Cost Categories organize spend. Key rule: Use Direct Connect gateway for multi-Region VPC connectivity through Direct Connect."
  ref: "Q280 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-gateways-intro.html"
  exams: [saa-open]

- id: open-saa-q281
  kind: choice
  en: "A central networking team must choose between PrivateLink and Transit Gateway. The requirement is that consumers privately access one provider service, not route freely to the provider VPC network. Which option is more appropriate?"
  options:
    - "Route 53 Resolver inbound endpoint only"
    - "VPC peering mesh"
    - "AWS Transit Gateway"
    - "AWS PrivateLink"
  correct: [D]
  why: "PrivateLink provides private access to a specific service through interface endpoints without exposing broad network connectivity to the provider VPC. Transit Gateway and peering are broader network routing constructs. Resolver endpoints handle DNS forwarding, not service exposure. Key rule: Use PrivateLink for private service access when broad network routing is not desired."
  ref: "Q281 (Architecture) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/privatelink/create-endpoint-service.html ; https://docs.aws.amazon.com/whitepapers/latest/aws-privatelink/how-does-aws-privatelink-work.html"
  exams: [saa-open]

- id: open-saa-q282
  kind: choice
  en: "A shared resource is created in one account and shared with an OU using AWS RAM. Which statement about permissions is accurate?"
  options:
    - "The sharing account loses ownership of the resource"
    - "The resource is copied into every participant account"
    - "The consuming account still needs IAM permissions for principals to use the shared resource"
    - "AWS RAM automatically grants administrator access in every consuming account"
  correct: [C]
  why: "AWS RAM grants access to the shared resource, but permissions that apply to roles and users in the consuming account still govern what principals can do. The resource is not copied and ownership remains with the resource owner. Key rule: RAM sharing grants resource access, but consuming principals still need appropriate IAM permissions."
  ref: "Q282 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/ram/latest/userguide/working-with-shared.html"
  exams: [saa-open]

- id: open-saa-q283
  kind: choice
  en: "A company wants to reduce cost for stable Amazon RDS usage with a one-year or three-year commitment. The team is evaluating reservation-style discounts for database capacity. Which option should it consider?"
  options:
    - "S3 Lifecycle rules"
    - "Route 53 Resolver rules"
    - "Reserved DB instances or eligible Database Savings Plans depending on flexibility needs"
    - "AWS WAF managed rules"
  correct: [C]
  why: "RDS supports reserved DB instances, and Database Savings Plans can apply to supported database services with more flexibility. S3 Lifecycle, WAF, and Resolver rules solve storage lifecycle, security filtering, and DNS forwarding rather than database cost commitments. Key rule: Use reservation or database savings commitment models for stable database usage."
  ref: "Q283 (Cost Optimization) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html"
  exams: [saa-open]

- id: open-saa-q284
  kind: choice
  en: "A multi-account organization wants to share a subnet only with accounts inside the organization and avoid invitation workflows for those accounts. What prerequisite improves this AWS RAM sharing experience?"
  options:
    - "Enable sharing with AWS Organizations in AWS RAM"
    - "Purchase a Compute Savings Plan"
    - "Create a public hosted zone"
    - "Disable all SCPs"
  correct: [A]
  why: "When sharing with accounts in the same organization, enabling AWS RAM sharing with AWS Organizations lets principals in the organization access shares without invitation workflows. Hosted zones, SCPs, and Savings Plans do not enable organization-integrated RAM sharing. Key rule: Enable AWS RAM sharing with AWS Organizations for seamless intra-organization resource sharing."
  ref: "Q284 (Governance) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/ram/latest/userguide/working-with-sharing-create.html"
  exams: [saa-open]

- id: open-saa-q285
  kind: choice
  en: "A company wants to track public and private IP address utilization trends and identify inefficient address use across AWS and on-premises networks. Which service capability should it use?"
  options:
    - "CloudTrail event history"
    - "VPC IPAM tracking and monitoring"
    - "AWS Budgets alert"
    - "AWS Transfer Family connector"
  correct: [B]
  why: "VPC IPAM provides visibility into IP address allocations, utilization, and usage trends across AWS and on-premises address space. CloudTrail records API events, Budgets alerts on cost, and Transfer Family handles file transfer. The boundary is IP address usage tracking. Key rule: Use VPC IPAM to track and monitor IP address utilization across environments."
  ref: "Q285 (Networking) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html ; https://docs.aws.amazon.com/vpc/latest/ipam/how-it-works-ipam.html"
  exams: [saa-open]

- id: open-saa-q286
  kind: choice
  en: "A data team stores compressed access logs in Amazon S3 and wants analysts to run SQL queries directly against the files without provisioning a data warehouse cluster. Which service is the best fit?"
  options:
    - "Amazon ElastiCache"
    - "AWS Application Migration Service"
    - "Amazon Athena"
    - "Amazon RDS Proxy"
  correct: [C]
  why: "Amazon Athena is a serverless interactive query service for analyzing data in Amazon S3 using SQL. RDS Proxy pools database connections, ElastiCache is an in-memory cache, and MGN rehosts servers. The boundary is ad hoc SQL over S3 data without managing query infrastructure. Key rule: Use Athena for serverless SQL queries over data stored in S3."
  ref: "Q286 (Analytics) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/athena/latest/ug/querying-athena-tables.html"
  exams: [saa-open]

- id: open-saa-q287
  kind: choice
  en: "A data lake contains new CSV and Parquet datasets in S3. The analytics team wants schema metadata discovered automatically and registered so Athena can query the data. What should they use?"
  options:
    - "Amazon OpenSearch Service"
    - "Amazon MQ"
    - "AWS Glue crawler and Data Catalog"
    - "AWS Transfer Family"
  correct: [C]
  why: "AWS Glue crawlers can discover datasets and populate the AWS Glue Data Catalog with table metadata that Athena can use. OpenSearch is for search and log analytics, Transfer Family handles file transfer, and Amazon MQ is a message broker. Key rule: Use Glue crawlers and the Data Catalog to discover and register S3 data lake schemas."
  ref: "Q287 (Analytics) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/glue/latest/dg/populate-catalog-methods.html ; https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html"
  exams: [saa-open]

- id: open-saa-q288
  kind: choice
  en: "An application emits clickstream events continuously, and the team wants a managed service to deliver the stream to Amazon S3 with buffering and minimal custom consumer code. Which service should be used?"
  options:
    - "AWS Glue Data Catalog only"
    - "Amazon EFS"
    - "Amazon Data Firehose"
    - "Amazon Athena"
  correct: [C]
  why: "Amazon Data Firehose is a managed service for delivering streaming data to destinations such as Amazon S3, with buffering and delivery management. Athena queries stored data, Glue Catalog stores metadata, and EFS is a file system. Key rule: Use Data Firehose for managed delivery of streaming data to destinations such as S3."
  ref: "Q288 (Analytics) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/firehose/latest/dev/create-destination.html"
  exams: [saa-open]

- id: open-saa-q289
  kind: choice
  en: "A big data team needs managed Hadoop and Spark clusters for large-scale ETL jobs and wants control over cluster runtime frameworks. Which AWS service fits best?"
  options:
    - "AWS Cost Categories"
    - "Amazon Athena only"
    - "Amazon EMR"
