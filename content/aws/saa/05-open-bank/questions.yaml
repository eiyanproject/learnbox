- id: open-saa-q171
  kind: choice
  en: "An operations team repeatedly performs the same remediation steps after a known alarm: stop an instance, create a snapshot, update a tag, and restart it. They want an auditable AWS-managed runbook instead of manual console work. What should they use?"
