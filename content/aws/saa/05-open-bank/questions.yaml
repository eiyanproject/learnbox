  why: "CloudWatch dashboards provide customizable visual pages for metrics and alarms across resources. Composite alarms are for alert logic, Config aggregators centralize compliance data, and Cost and Usage Reports are billing exports. The need here is human-facing operational visualization. Key rule: Use CloudWatch dashboards for shared operational visualization of metrics and alarms."
  ref: "Q164 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Dashboards.html"
  exams: [saa-open]

- id: open-saa-q165
  kind: choice
  en: "A company wants to continuously test a public checkout workflow from outside the application by loading a page and checking that critical steps succeed. The check should run on a schedule and alert on failure. Which service feature fits best?"
