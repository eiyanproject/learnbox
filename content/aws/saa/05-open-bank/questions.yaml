  correct: [A]
  why: "Session Manager provides managed interactive access to instances through Systems Manager without opening inbound ports, maintaining bastions, or managing SSH keys. A bastion violates the stated requirement, and VPC peering or CloudTrail Lake do not provide shell access. Key rule: Use Session Manager for managed instance access without inbound SSH or bastion hosts."
  ref: "Q169 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"
