    - "Amazon Inspector only"
  correct: [B]
  why: "Patch Manager automates scanning and installing approved patches on managed nodes and reports patch compliance against baselines. Inspector finds vulnerabilities, but Patch Manager is the operational patching tool. Config aggregators and Cost Explorer solve different problems. Key rule: Use Systems Manager Patch Manager for managed patch scanning, installation, and compliance."
  ref: "Q170 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager.html"
