- id: open-saa-q186
  kind: choice
  en: "A company wants to rehost 300 on-premises virtual machines to Amazon EC2 with minimal changes. The team needs continuous replication, non-disruptive testing, and a controlled cutover window. Which AWS service is the best fit?"
