    - "AWS X-Ray trace map"
    - "Service Quotas"
  correct: [A]
  why: "A CloudWatch Logs metric filter extracts matching log events and publishes metric data that can then be alarmed on. X-Ray traces request paths, Config evaluates resource configuration, and Service Quotas tracks limits. The boundary is converting a log pattern into a metric. Key rule: Use a metric filter when a log pattern should become a CloudWatch metric for alerting."
  ref: "Q163 (Operations) from github.com/BerkayCakibey/aws-saa-tips by Berkay Cakibey, MIT licence. AWS docs: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/MonitoringLogData.html ; https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Alarms.html"
  exams: [saa-open]

- id: open-saa-q164
  kind: choice
  en: "An operations manager wants a single visual page showing CPU, latency, error-rate, and queue-depth widgets for several production services. The page is for human review, not automated alerting. Which CloudWatch capability should be used?"
