title: "AWS"
order: 11
description: "Amazon Web Services with the real AWS CLI, run against a local emulator: no account, no credentials, no bill. Hands-on lessons are graded on what your commands actually build; practice exams follow the certification guides."
badge: "No Surprise Bill"
# The practice exams. Each draws its domains in the proportions of the
# official exam guide.
exams:
  - id: saa
    title: "Solutions Architect - Associate (SAA-C03)"
    minutes: 130
    pass: 720
    max: 1000
    shuffle: true
    note: "The real exam has 65 questions, 15 of them unscored and not marked as such, and scales its score; here all 65 count equally."
    draw:
      - { kind: choice, count: 20, points: 1, from: aws/saa/01-secure }
      - { kind: choice, count: 17, points: 1, from: aws/saa/02-resilient }
      - { kind: choice, count: 15, points: 1, from: aws/saa/03-performance }
      - { kind: choice, count: 13, points: 1, from: aws/saa/04-cost }
  - id: saa-open
    title: "Solutions Architect - Associate (SAA-C03): open bank"
    minutes: 130
    pass: 720
    max: 1000
    shuffle: true
    note: "65 questions drawn at random from the open practice bank by Berkay Cakibey (github.com/BerkayCakibey/aws-saa-tips, MIT licence), not weighted by domain."
    draw:
      - { kind: choice, count: 65, points: 1, from: aws/saa/05-open-bank }
  - id: dva
    title: "Developer - Associate (DVA-C02)"
    minutes: 130
    pass: 720
    max: 1000
    shuffle: true
    note: "The real exam has 65 questions, 15 of them unscored and not marked as such, and scales its score; here all 65 count equally."
    draw:
      - { kind: choice, count: 21, points: 1, from: aws/dva/01-development }
      - { kind: choice, count: 17, points: 1, from: aws/dva/02-security }
      - { kind: choice, count: 15, points: 1, from: aws/dva/03-deployment }
      - { kind: choice, count: 12, points: 1, from: aws/dva/04-troubleshooting }
  - id: soa
    title: "CloudOps Engineer - Associate (SOA-C03)"
    minutes: 130
    pass: 720
    max: 1000
    shuffle: true
    note: "SOA-C03 replaced the SysOps Administrator exam (SOA-C02) in 2025. The real exam has 65 questions, 15 of them unscored, and scales its score; here all 65 count equally."
    draw:
      - { kind: choice, count: 14, points: 1, from: aws/soa/01-monitoring }
      - { kind: choice, count: 14, points: 1, from: aws/soa/02-reliability }
      - { kind: choice, count: 14, points: 1, from: aws/soa/03-deployment }
      - { kind: choice, count: 11, points: 1, from: aws/soa/04-security }
      - { kind: choice, count: 12, points: 1, from: aws/soa/05-networking }
  - id: sap
    title: "Solutions Architect - Professional (SAP-C02)"
    minutes: 180
    pass: 750
    max: 1000
    shuffle: true
    note: "The real exam has 75 questions, 10 of them unscored and not marked as such, and scales its score; here all 75 count equally."
    draw:
      - { kind: choice, count: 20, points: 1, from: aws/sap/01-organizational-complexity }
      - { kind: choice, count: 22, points: 1, from: aws/sap/02-new-solutions }
      - { kind: choice, count: 19, points: 1, from: aws/sap/03-continuous-improvement }
      - { kind: choice, count: 14, points: 1, from: aws/sap/04-migration }
  - id: dop
    title: "DevOps Engineer - Professional (DOP-C02)"
    minutes: 180
    pass: 750
    max: 1000
    shuffle: true
    note: "The real exam has 75 questions, 10 of them unscored and not marked as such, and scales its score; here all 75 count equally."
    draw:
      - { kind: choice, count: 17, points: 1, from: aws/dop/01-sdlc }
      - { kind: choice, count: 13, points: 1, from: aws/dop/02-config-iac }
      - { kind: choice, count: 11, points: 1, from: aws/dop/03-resilient }
      - { kind: choice, count: 11, points: 1, from: aws/dop/04-monitoring }
      - { kind: choice, count: 10, points: 1, from: aws/dop/05-incident }
      - { kind: choice, count: 13, points: 1, from: aws/dop/06-security }
sections:
  - id: foundations
    xp: 50
    beginner: true
    title: 1. Foundations
    description: "The CLI and your sandbox account, IAM users, groups, policies and roles, S3 done safely, and a VPC with a server in it - built from the command line."
  - id: networking
    xp: 75
    title: 2. Networking in depth
    description: "NAT gateways per Availability Zone, network ACLs that deny, VPC endpoints that keep traffic off the internet, and peering with private DNS."
  - id: compute
    xp: 75
    title: 3. Compute and scaling
    description: "Launch templates and user data, an Application Load Balancer with HTTPS, and an Auto Scaling group that scales on load and on schedule."
  - id: databases
    xp: 100
    title: 4. Databases
    description: "RDS with Multi-AZ, encryption and a managed password, DynamoDB designed around its access patterns, and a Redis cache that survives an AZ."
  - id: serverless
    xp: 100
    title: 5. Serverless and messaging
    description: "Queues with dead-letter queues, SNS fan-out, Lambda functions fed by SQS, and EventBridge schedules driving a Step Functions workflow."
  - id: operations
    xp: 100
    title: 6. Operations and infrastructure as code
    description: "Logs, metric filters and alarms, CloudTrail and Config for audit, and the same resources described once in CloudFormation."
  - id: security
    xp: 125
    title: 7. Encryption, secrets and governance
    description: "KMS key policies, grants and envelope encryption, Secrets Manager with rotation and Parameter Store, and an organization with OUs and service control policies."
  - id: containers
    xp: 125
    title: 8. Containers, DNS and the edge
    description: "ECR repositories with lifecycle rules, an ECS service on Fargate, an EKS cluster with managed nodes, Route 53 failover and weighted routing, and CloudFront in front of a private bucket."
  - id: cicd
    xp: 125
    title: 9. CI/CD
    description: "A CodeBuild project and a CodePipeline from source to an approved CloudFormation deploy, and Lambda canary releases with CodeDeploy that roll back on an alarm."
  - id: saa
    title: "Exam practice: Solutions Architect - Associate"
    description: "Multiple-choice questions by exam domain - secure, resilient, high-performing, cost-optimized - a timed 65-question mock exam, and an open bank of 325 more questions with its own mock."
  - id: dva
    title: "Exam practice: Developer - Associate"
    description: "Multiple-choice questions by exam domain - development, security, deployment, troubleshooting - and a timed 65-question mock exam."
  - id: soa
    title: "Exam practice: CloudOps Engineer - Associate"
    description: "Multiple-choice questions by exam domain - monitoring, reliability, automation, security, networking - and a timed 65-question mock exam."
  - id: sap
    title: "Exam practice: Solutions Architect - Professional"
    description: "Long multi-constraint scenarios by exam domain - organizational complexity, new solutions, continuous improvement, migration - and a timed 75-question mock exam."
  - id: dop
    title: "Exam practice: DevOps Engineer - Professional"
    description: "Scenarios by exam domain - SDLC automation, IaC, resilience, monitoring, incident response, security - and a timed 75-question mock exam."
